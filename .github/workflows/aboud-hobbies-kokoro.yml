name: Aboud Hobbies - Kokoro AI Voices
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aboud-hobbies-kokoro.yml'
      - 'scripts/generate_aboud_hobbies_audio.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aboud-hobbies-audio
  cancel-in-progress: false
jobs:
  generate-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kokoro
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          python -m pip install 'kokoro>=0.9.4,<1.0' soundfile numpy
      - name: Generate 96 English MP3 files
        run: python scripts/generate_aboud_hobbies_audio.py
      - name: Verify audio output
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('experimental/aboud-hobby-adventure/audio')
          for voice in ('bella','heart','sarah'):
            files=list((root/voice).glob('*.mp3'))
            assert len(files)==32 and all(p.stat().st_size>800 for p in files), (voice,len(files))
          print('96 clips verified')
          PY
      - name: Commit Aboud audio only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experimental/aboud-hobby-adventure/audio/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audio(aboud): publish free Kokoro hobby voices'
          for n in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
