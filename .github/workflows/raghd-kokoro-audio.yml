name: Build Raghd's Kokoro MP3 lessons

on:
  push:
    paths:
      - .github/workflows/raghd-kokoro-audio.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: raghd-kokoro-audio
  cancel-in-progress: false

jobs:
  produce-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Install Kokoro and media tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install kokoro-onnx soundfile numpy
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Download freely licensed Kokoro 1.0 model and voices
        run: |
          curl --fail --location --retry 3 --output /tmp/kokoro-v1.0.int8.onnx \
            https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.int8.onnx
          curl --fail --location --retry 3 --output /tmp/voices-v1.0.bin \
            https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
      - name: Synthesize all Raghd lesson words and sentences
        shell: bash
        run: |
          python - <<'PY'
          import os, subprocess, tempfile
          import soundfile as sf
          from kokoro_onnx import Kokoro
          tts=Kokoro("/tmp/kokoro-v1.0.int8.onnx", "/tmp/voices-v1.0.bin")
          shelters={
            "try-voice":"Hello, Raghd! A mouse lives in a hole.",
            "voice-change":"Hello, Raghd! Let's learn animal homes.",
            "sentence-mouse":"A mouse lives in a hole.",
            "sentence-cat":"A cat lives in a basket.",
            "sentence-dog":"A dog lives in a kennel.",
            "sentence-bird":"A bird lives in a nest.",
            "words-mouse":"Mouse. Hole.",
            "words-cat":"Cat. Basket.",
            "words-dog":"Dog. Kennel.",
            "words-bird":"Bird. Nest.",
            "animal-mouse":"Mouse.",
            "animal-cat":"Cat.",
            "animal-dog":"Dog.",
            "animal-bird":"Bird.",
            "home-hole":"Hole.",
            "home-basket":"Basket.",
            "home-kennel":"Kennel.",
            "home-nest":"Nest.",
          }
          h={
            "letter-name":"Letter H.",
            "letter-sound":"H makes the hhh sound. Hhh, hat.",
            "try-voice":"Hello Raghd! Let's learn H.",
          }
          for word, sentence in {
            "hat":"This is my hat.",
            "hen":"The hen is happy.",
            "hand":"This is my hand.",
            "horse":"I see a horse.",
            "house":"This is a house.",
            "honey":"Honey is sweet.",
          }.items():
            h["word-"+word]=word.capitalize()+"."
            h["sentence-"+word]=sentence
          for voice in ("af_bella","af_heart"):
            for base, phrases in (("raghd/animal-shelters/audio",shelters),("raghd/letter-h/audio",h)):
              directory=os.path.join(base,"bella" if voice=="af_bella" else "heart")
              os.makedirs(directory,exist_ok=True)
              for key,text in phrases.items():
                dest=os.path.join(directory,key+".mp3")
                if os.path.exists(dest) and os.path.getsize(dest)>1000:continue
                pcm,rate=tts.create(text,voice=voice,speed=1,lang="en-us")
                with tempfile.NamedTemporaryFile(suffix=".wav") as tmp:
                  sf.write(tmp.name,pcm,rate)
                  subprocess.run(["ffmpeg","-hide_banner","-loglevel","error","-y","-i",tmp.name,
                                  "-ac","1","-ar","24000","-c:a","libmp3lame","-q:a","5",dest],check=True)
                print(voice, key, os.path.getsize(dest), flush=True)
          PY
      - name: Commit generated small MP3s to GitHub Pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add raghd/animal-shelters/audio/ raghd/letter-h/audio/
          if git diff --cached --quiet; then echo "Audio already built"; else
            git commit -m "Add pre-recorded Kokoro Bella and Heart MP3s for Raghd"
            git push origin HEAD:main
          fi
