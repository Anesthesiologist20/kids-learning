name: Sakinah Page 68 Heart listening audio
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sakinah-page68-heart.yml'
      - 'sakinah/page68-audio-manifest.json'
      - 'scripts/generate_kokoro_sakinah.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sakinah-p68-heart
  cancel-in-progress: false
jobs:
  render-heart:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free Heart Kokoro voice tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng
          python -m pip install 'kokoro>=0.9.4,<1.0' numpy soundfile
      - name: Generate Sakinah Page 68 listening practice
        run: python scripts/generate_kokoro_sakinah.py sakinah/page68-audio-manifest.json
      - name: Publish generated MP3 files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sakinah/audio/kokoro/heart/p68-*.mp3
          if git diff --cached --quiet; then
            echo "Audio already up to date"
            exit 0
          fi
          git commit -m "audio(sakinah): publish page 68 Heart voice"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            if git push origin HEAD:main; then
              echo "Heart audio published"
              exit 0
            fi
            sleep 4
          done
          exit 1
