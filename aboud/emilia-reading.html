<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aboud · Emilia's New Year's Adventure</title><style>
:root{font:clamp(17px,2vw,23px)/1.65 system-ui,sans-serif;color:#26334e;background:#f3f6ff}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:auto;padding:18px}a{color:#265d9a}header{background:linear-gradient(120deg,#153b79,#7858c7);color:white;border-radius:22px;padding:25px}h1{line-height:1.15;margin:8px 0;font-size:clamp(30px,5vw,50px)}.box{background:white;border:1px solid #dde3f3;border-radius:18px;padding:18px;margin:16px 0}.controls{display:grid;grid-template-columns:1fr 1fr auto auto;gap:10px;align-items:end}label{display:grid;gap:5px;font-weight:750}select,button{font:inherit;border-radius:12px;padding:10px;border:1px solid #cbd5e9;min-height:48px}button{cursor:pointer;background:#e7eafb;color:#2e4072;font-weight:800}button:disabled{opacity:.5}.play{background:#315baf;color:white}.sentence{display:flex;align-items:center;gap:12px;border-bottom:1px solid #e6e9f4;padding:11px 0}.sentence p{flex:1;margin:0}.sentence button{white-space:nowrap}.sentence.active{background:#f1edff;border-radius:10px;padding-inline:8px}.badge{display:inline-block;background:#e6dafa;border-radius:30px;padding:5px 13px;font-size:.75rem}.pages{display:flex;gap:10px;flex-wrap:wrap}.pages button.active{background:#334a9a;color:white}.feedback{min-height:24px;color:#5a4c91;font-size:.85rem}.quiz button{margin:5px}.good{background:#d8f4e7!important}.bad{background:#ffe1e7!important}@media(max-width:650px){.controls{grid-template-columns:1fr 1fr}.sentence{align-items:flex-start}.sentence p{font-size:.96rem}.sentence button{padding:8px}}
</style></head><body><main><a href="./">← Aboud's Learning Corner</a><header><span class="badge">📚 Grade 2 · Reading Adventure</span><h1>Emilia’s New Year’s Adventure 🔎</h1><p>Read with Aboud. Tap 🔊 at the end of each sentence. Choose one of three AI teachers and a reading speed.</p></header><div class="box controls"><label>Teacher<select id="voice"><option value="bella">🌸 Bella</option><option value="heart">💜 Heart</option><option value="sarah">⭐ Sarah</option></select></label><label>Speed<select id="speed"><option value="0.7">Extra slow</option><option value="0.85" selected>Slow</option><option value="1">Normal</option></select></label><button id="sample">🔊 Test</button><button id="stop">⏹ Stop</button><div id="status" class="feedback" style="grid-column:1/-1">Choose your teacher. Each button reads one sentence only.</div></div><div class="box"><div class="pages"><button data-page="0" class="active">📖 Page 40</button><button data-page="1">📖 Page 41</button></div><div id="reading"></div></div><div class="box quiz"><h2>🔍 Detective Check</h2><p id="question"></p><div id="answers"></div><p id="quizStatus"></p><button id="nextQuestion">Next question →</button></div></main><script>
const P=[["Emilia is sitting on the sofa.","She’s looking out the window.","I’m so bored!","It’s her parents’ New Year’s Eve party.","How’s second grade?","Any mysteries?","Emilia loves detective games.","She likes reading detective stories, too.","She wants to be a famous detective!","Why don’t you try out your new binoculars?","What a great idea!","I have them in my room.","Emilia gets her binoculars and goes outside.","She’s very excited."],["Emilia is outside looking through the binoculars.","Suddenly, she hears a noise!","She’s scared.","Then, the garden shed door opens.","Who’s there?","Emilia runs into the house.","Dad!","There’s someone in the yard!","Not now, Emilia.","It’s almost midnight.","Emilia looks around.","Everyone is standing in a circle holding hands.","It’s almost midnight.","The new year is coming!","Ten, nine, eight, seven ...","Oh, no!","I have to do something!"]];
const Q=[["Why is Emilia bored?",["She is at a party.","She is playing outside.","She is asleep."],0],["What does Emilia want to be?",["A doctor","A detective","A singer"],1],["What does Mom suggest?",["Using binoculars","Reading a book","Going to bed"],0],["What opens in the garden?",["A car","The shed door","A window"],1],["Why is Dad not listening?",["He is sleeping","It is nearly midnight","He is reading"],1],["What is everyone doing?",["Holding hands","Eating lunch","Playing football"],0]];
const $=id=>document.getElementById(id);let page=0,qi=0,audio=null;
function stop(){if(audio){audio.pause();audio.removeAttribute("src");audio.load();audio=null}document.querySelectorAll(".sentence").forEach(e=>e.classList.remove("active"))}
function play(id,el){stop();const voice=$("voice").value;audio=new Audio("audio/emilia/"+voice+"/"+id+".mp3");audio.playbackRate=Number($("speed").value);if(el)el.classList.add("active");$("status").textContent="🔊 "+voice+" · One sentence";audio.onended=()=>{if(el)el.classList.remove("active");$("status").textContent="Your turn, Aboud. Read it aloud!"};audio.onerror=()=>{$("status").textContent="Audio is being prepared. Please try again after publishing."};audio.play().catch(()=>{$("status").textContent="Unable to play. Please try again."})}
function render(){const start=page===0?0:P[0].length;$("reading").innerHTML=P[page].map((s,i)=>'<div class="sentence" id="line-'+i+'"><p>'+s.replaceAll("&","&amp;").replaceAll("<","&lt;")+'</p><button aria-label="Listen to sentence '+(i+1)+'" data-line="'+(start+i)+'">🔊 Listen</button></div>').join("");document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",Number(b.dataset.page)===page))}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.page!==undefined){page=Number(b.dataset.page);stop();render()}if(b.dataset.line!==undefined){play("line-"+b.dataset.line,b.closest(".sentence"))}});
$("voice").onchange=stop;$("speed").onchange=()=>{if(audio)audio.playbackRate=Number($("speed").value)};$("stop").onclick=stop;$("sample").onclick=()=>play("line-0");
function quiz(){const q=Q[qi];$("question").textContent=(qi+1)+". "+q[0];$("answers").innerHTML=q[1].map((a,i)=>'<button data-answer="'+i+'">'+a+'</button>').join("");$("quizStatus").textContent=""}
$("answers").onclick=e=>{const b=e.target.closest("[data-answer]");if(!b||$("quizStatus").textContent)return;const right=Number(b.dataset.answer)===Q[qi][2];b.classList.add(right?"good":"bad");$("quizStatus").textContent=right?"Correct! ⭐":"Try again after reading the story. The answer is: "+Q[qi][1][Q[qi][2]]};
$("nextQuestion").onclick=()=>{qi=(qi+1)%Q.length;quiz()};render();quiz();
</script></body></html>
