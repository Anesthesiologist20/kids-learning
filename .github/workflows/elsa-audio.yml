name: ELSA Bella and Heart reading audio
on:
  push:
    paths:
      - ".github/workflows/elsa-audio.yml"
      - "sakinah/elsa-reading/lesson.json"
      - "sakinah/elsa-reading/generate_audio.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free speech synthesis
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          python -m pip install --upgrade pip
          python -m pip install "kokoro>=0.9.4" soundfile numpy
      - name: Generate both Kokoro voices for page 62
        run: python sakinah/elsa-reading/generate_audio.py
      - name: Commit audio files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sakinah/elsa-reading/audio/
          if ! git diff --cached --quiet; then
            git commit -m "Generate ELSA page 62 Bella and Heart audio clips"
            git push origin HEAD:main
          fi
