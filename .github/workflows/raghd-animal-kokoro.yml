name: Raghd Animal Adventure - Free Kokoro Voices
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/raghd-animal-kokoro.yml'
      - 'scripts/generate_raghd_animal_audio.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: raghd-animal-kokoro
  cancel-in-progress: false
jobs:
  raghd-audio:
    name: 123 MP3 recordings - Bella Heart Sarah
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free voice engine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          python -m pip install 'kokoro>=0.9.4,<1.0' soundfile numpy
      - name: Generate all recordings
        run: python scripts/generate_raghd_animal_audio.py
      - name: Check outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('experimental/raghd-animal-adventure/audio')
          words='animals park rabbit hop fur fish swim scales bird fly feathers snake slither horse run sheep wool fluffy turtle shell'.split()
          names=[f'scene-{i:02d}-{j:02d}.mp3' for i in range(1,11) for j in range(1,3)]
          names += [f'word-{x}.mp3' for x in words]+['preview.mp3']
          files=[root/v/n for v in ('bella','heart','sarah') for n in names]
          assert len(files)==123 and all(p.exists() and p.stat().st_size>800 for p in files)
          print('All 123 verified')
          PY
      - name: Publish MP3 recordings
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experimental/raghd-animal-adventure/audio
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audio(raghd): add 123 Kokoro MP3 recordings'
          for n in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            git push origin HEAD:main && exit 0
            sleep 4
          done
          exit 1
