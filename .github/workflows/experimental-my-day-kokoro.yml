name: Experimental My Day Free Kokoro Audio
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/experimental-my-day-kokoro.yml'
      - 'scripts/generate_experimental_my_day_audio.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: experimental-my-day-kokoro
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free Kokoro
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          python -m pip install 'kokoro>=0.9.4,<1.0' soundfile numpy
      - name: Generate and verify 36 recordings
        run: python scripts/generate_experimental_my_day_audio.py
      - name: Publish MP3 recordings
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experimental/audio/kokoro/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audio(experimental): publish Bella Heart Sarah My Day recordings'
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            if git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          exit 1
