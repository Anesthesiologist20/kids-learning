name: Validate Sakinah Space Story on Image Upload
on:
  push:
    branches: [main]
    paths:
      - 'experimental/sakinah-space-journey/images/*.webp'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify JavaScript syntax
        run: node --check experimental/sakinah-space-journey/space-story.js
      - name: Validate 10 scene pictures
        run: |
          python -m pip install Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          directory=Path('experimental/sakinah-space-journey/images')
          expected={f'{i:02}.webp' for i in range(1,11)}
          found={x.name for x in directory.glob('*.webp')}
          assert found==expected, f'Missing: {sorted(expected-found)}; unexpected: {sorted(found-expected)}'
          for name in sorted(expected):
            picture=directory/name
            with Image.open(picture) as image:
              image.verify()
            with Image.open(picture) as image:
              assert image.width>=1500 and image.height>=800, name
              assert 1.7 <= image.width/image.height <=1.85, name
            assert picture.stat().st_size>30_000, name
          print('PASS: all 10 independent high-quality scene images')
          PY
      - name: Verify audio filenames if already generated
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('experimental/sakinah-space-journey/audio')
          if not root.exists():
            print('Audio pending. Kokoro workflow publishes MP3s separately.')
          else:
            names=[f'scene-{i:02}-{j:02}.mp3' for i in range(1,11) for j in (1,2)]
            words='stars telescope dream space journey rocket planet robot astronaut launch countdown gravity float earth orbit moon crater explore saturn rings asteroids alien imaginary scientist adventure friendship'.split()
            names += [f'word-{w}.mp3' for w in words]
            names += [f'question-{i:02}.mp3' for i in range(1,11)]+['preview.mp3']
            files=[root/v/name for v in ('bella','heart','sarah') for name in names]
            assert len(files)==171 and all(x.exists() and x.stat().st_size>800 for x in files)
            print('PASS: 171/171 MP3 audio files')
          PY
