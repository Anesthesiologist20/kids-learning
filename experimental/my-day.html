<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>A Day in My Life • Reading Lab</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f5f5ff;color:#24233e}main{max-width:1050px;margin:auto;padding:18px 15px 70px}header{background:linear-gradient(110deg,#5c53c9,#2a9cba);border-radius:22px;padding:22px;color:white}header a{color:white}.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:end;background:white;border-radius:18px;padding:14px;margin:18px 0}label{display:grid;gap:5px;font-weight:700}select{border:1px solid #bdb8dc;padding:11px;border-radius:10px;font:inherit}button{font:inherit;border:0;border-radius:12px;padding:12px 15px;min-height:45px;background:#6250bf;color:white;font-weight:800;cursor:pointer}button:disabled{opacity:.45}.secondary{background:#eae5fb;color:#493b9b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,295px),1fr));gap:15px}.card{background:white;border:2px solid #e2def5;border-radius:19px;padding:15px}.card.done{border-color:#64c69a}.scene{aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:#fff0e4;cursor:zoom-in}.scene img{width:100%;height:100%;object-fit:contain}.sentence{font-size:clamp(21px,2.5vw,28px);font-weight:850;line-height:1.5;margin:12px 0}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{flex:1;padding:10px 7px}.meta{font-size:14px;color:#6654a2;font-weight:800;margin:10px 0}.status{color:#645b70;font-size:14px;min-height:20px}.overlay{display:none;position:fixed;inset:0;z-index:10;background:#0d0828dd;align-items:center;justify-content:center;padding:10px}.overlay.open{display:flex}.reader{background:white;width:min(100%,900px);max-height:96dvh;overflow:auto;border-radius:24px;padding:clamp(12px,3vw,22px);text-align:center}.reader img{max-width:100%;max-height:53dvh;object-fit:contain;border-radius:12px}.nav{display:flex;gap:7px;margin:12px 0}.nav button{flex:1;padding:12px 4px}.top{display:flex;justify-content:space-between;align-items:center}.hint{font-size:14px;color:#615a76}@media(max-width:600px){.nav button{font-size:14px}.reader img{max-height:47dvh}}</style></head><body><main><header><a href="./">← Experimental Lab</a><h1>🌞 A Day in My Life</h1><p>Read each sentence and explore the pictures!</p></header><div class="controls"><label>Voice<select id="voice"><option value="bella">Bella</option><option value="heart">Heart</option><option value="sarah">Sarah</option></select></label><label>Speed<select id="speed"><option value=".75">Slow</option><option value="1" selected>Normal</option><option value="1.2">Fast</option></select></label><button class="secondary" id="review">⚑ Review needed</button><button class="secondary" id="all">Show all</button><strong id="progress"></strong></div><p class="hint">Images are being prepared for upload. Audio requires recorded files; no browser voice is used.</p><section class="grid" id="cards"></section></main><div class="overlay" id="overlay" role="dialog" aria-modal="true"><div class="reader"><div class="top"><span id="count"></span><button id="close">✕ Close</button></div><div id="large"></div><p class="sentence" id="text"></p><div class="nav"><button id="prev">⬅ Previous</button><button id="read">🔊 Read</button><button id="next">Next ➡</button></div><div class="nav"><button class="secondary" id="practice">☆ I Practiced</button><button class="secondary" id="need">⚑ Review</button></div><p class="status" id="modalStatus"></p></div></div><script>const lines=["I brush my teeth in the morning.","I go to school with my dad.","I see the school and my friends.","I enjoy my class.","I come back home from school.","I eat my lunch.","I do my homework.","I play football.","I take a shower.","I pray Maghrib.","I have my dinner.","I go to sleep."];const $=id=>document.getElementById(id);const key="kids-reading:experimental-my-day-v1";let progress={};try{progress=JSON.parse(localStorage.getItem(key))||{}}catch{}let current=0,player=null,review=false;function save(){localStorage.setItem(key,JSON.stringify(progress))}function stop(){if(player){player.pause();player=null}}function picture(i){const img=document.createElement("img");img.src="images/scene-"+String(i+1).padStart(2,"0")+".webp";img.alt="Scene "+(i+1);img.loading="lazy";img.onerror=()=>{img.replaceWith(Object.assign(document.createElement("div"),{textContent:"🖼️ Illustration "+(i+1)+" — upload pending",style:"padding:55px 12px;text-align:center;color:#6b5b87"}))};return img}function audio(i,status){stop();const src="audio/kokoro/"+$("voice").value+"/scene-"+String(i+1).padStart(2,"0")+".mp3";const a=new Audio(src);player=a;a.playbackRate=Number($("speed").value);status.textContent="Loading…";a.onplaying=()=>status.textContent="Listen and repeat!";a.onended=()=>status.textContent="Your turn ⭐";a.onerror=()=>status.textContent="Recording not uploaded yet.";a.play().catch(()=>status.textContent="Recording unavailable.")}function mark(i,val){progress[i]=val;save();draw();if($("overlay").classList.contains("open"))show()}function draw(){$("cards").replaceChildren();lines.forEach((line,i)=>{if(review&&progress[i]!=="review")return;const card=document.createElement("article");card.className="card"+(progress[i]==="done"?" done":"");const num=document.createElement("div");num.className="meta";num.textContent="Sentence "+(i+1)+" / "+lines.length;const scene=document.createElement("div");scene.className="scene";scene.append(picture(i));scene.onclick=()=>open(i);const sentence=document.createElement("div");sentence.className="sentence";sentence.textContent=line;const actions=document.createElement("div");actions.className="actions";const status=document.createElement("div");status.className="status";for(const [name,fn,cls] of [["🔊 Listen",()=>audio(i,status),""],["🔎 Zoom",()=>open(i),"secondary"],[progress[i]==="done"?"⭐ Practiced":"☆ I Practiced",()=>mark(i,"done"),"secondary"],["⚑",()=>mark(i,"review"),"secondary"]]){const b=document.createElement("button");b.textContent=name;b.className=cls;b.onclick=fn;actions.append(b)}card.append(num,scene,sentence,actions,status);$("cards").append(card)});$("progress").textContent="⭐ "+Object.values(progress).filter(x=>x==="done").length+" / "+lines.length+" practiced"}function open(i){current=i;$("overlay").classList.add("open");show();$("close").focus()}function show(){stop();$("large").replaceChildren(picture(current));$("text").textContent=lines[current];$("count").textContent=(current+1)+" / "+lines.length;$("prev").disabled=current===0;$("next").disabled=current===lines.length-1;$("practice").textContent=progress[current]==="done"?"⭐ Practiced":"☆ I Practiced";$("modalStatus").textContent=""}function move(n){const i=current+n;if(i>=0&&i<lines.length){current=i;show()}}function close(){stop();$("overlay").classList.remove("open")}$("prev").onclick=()=>move(-1);$("next").onclick=()=>move(1);$("read").onclick=()=>audio(current,$("modalStatus"));$("practice").onclick=()=>mark(current,"done");$("need").onclick=()=>mark(current,"review");$("close").onclick=close;$("review").onclick=()=>{review=true;draw()};$("all").onclick=()=>{review=false;draw()};$("overlay").onclick=e=>{if(e.target===$("overlay"))close()};document.addEventListener("keydown",e=>{if(!$("overlay").classList.contains("open"))return;if(e.key==="Escape")close();if(e.key==="ArrowRight")move(1);if(e.key==="ArrowLeft")move(-1)});let x=null;$("overlay").addEventListener("touchstart",e=>{x=e.touches[0].clientX},{passive:true});$("overlay").addEventListener("touchend",e=>{if(x===null)return;const d=e.changedTouches[0].clientX-x;if(Math.abs(d)>60)move(d<0?1:-1);x=null},{passive:true});draw();</script></body></html>
