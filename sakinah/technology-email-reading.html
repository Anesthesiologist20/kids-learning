<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sakinah • Technology Email Reading</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f3ff;color:#292446;font-family:system-ui,-apple-system,sans-serif}header{background:#6148b1;color:white;padding:16px 4%;display:flex;justify-content:space-between;gap:12px;align-items:center}header a{color:white}main{max-width:1150px;margin:auto;padding:22px 16px 70px}h1{font-size:clamp(28px,4vw,46px);margin:10px 0}p{line-height:1.5}.controls{display:flex;gap:12px;flex-wrap:wrap;background:white;border-radius:20px;padding:16px;margin:18px 0;align-items:end}label{font-weight:700;display:grid;gap:6px}select,button{font:inherit;min-height:48px;border-radius:12px;padding:9px 14px}select{border:2px solid #d5c9f3;background:white}button{border:0;background:#6c4db7;color:white;font-weight:800;cursor:pointer}button.secondary{background:#ece5ff;color:#513698}.tabs{display:flex;gap:10px;flex-wrap:wrap}.tabs button.active{background:#263c80}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:18px;margin-top:18px}.card{background:white;border:2px solid #e3daf8;border-radius:22px;padding:16px;box-shadow:0 5px 16px #35236710}.scene{width:100%;height:185px;border-radius:16px;background:linear-gradient(135deg,#eee7ff,#dcf4ff);display:grid;place-items:center;font-size:76px;cursor:zoom-in}.sentence{font-size:clamp(21px,2.2vw,28px);font-weight:750;min-height:90px;line-height:1.45;margin:16px 0}.buttons{display:flex;flex-wrap:wrap;gap:8px}.buttons button{flex:1}.status{font-size:13px;color:#735d89;min-height:22px;margin-top:10px}.modal{position:fixed;inset:0;background:#17132be9;display:none;z-index:10;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.zoom{background:white;border-radius:25px;width:min(95vw,900px);padding:25px;text-align:center}.zoom .art{background:#eee8ff;border-radius:20px}.zoom .art svg{width:100%;max-height:65vh}.scene svg{width:100%;height:100%;object-fit:contain}.zoom p{font-size:clamp(26px,5vw,48px);font-weight:800}.hint{font-size:14px;color:#66577f} @media(min-width:700px){.grid{grid-template-columns:repeat(2,1fr)}} </style></head><body>
<header><b>🌷 Sakinah's Reading Adventure</b><a href="index.html">← Sakinah Home</a></header><main><h1>💌 Technology Email Reading</h1><p>Look at the picture. Listen. Read aloud. Zoom in to see more!</p><div class="tabs" id="tabs"></div><div class="controls"><label>Teacher voice<select id="voice"><option value="bella">🌸 Bella</option><option value="heart">💜 Heart</option><option value="sarah">⭐ Sarah</option></select></label><label>Reading speed<select id="speed"><option value=".7">🐢 Extra slow</option><option value=".85" selected>🌿 Slow</option><option value="1">🙂 Normal</option></select></label><button class="secondary" id="stop">⏹ Stop</button><button class="secondary" id="larger">A+ Bigger text</button></div><p class="hint">Audio uses recorded Kokoro AI voices, never browser speech. New recordings must be uploaded before playback becomes available.</p><div id="journey" style="background:white;border-radius:18px;padding:15px;margin-top:16px;font-weight:800" role="status">⭐ 0 sentences practiced</div><section class="grid" id="cards"></section></main><div class="modal" id="modal" role="dialog" aria-modal="true"><div class="zoom"><button id="close">✕ Close</button><div class="art" id="zoomart"></div><p id="zoomtext"></p></div></div><script>
function illustration(story,i){const robot=story===0;const bg=robot?'#dff3ff':'#fff0f6';const object=robot?'<rect x="198" y="80" width="100" height="112" rx="22" fill="#e7f0ff" stroke="#526ca9" stroke-width="5"/><rect x="208" y="96" width="80" height="48" rx="15" fill="#27365c"/><circle cx="233" cy="120" r="7" fill="#36d6ee"/><circle cx="265" cy="120" r="7" fill="#36d6ee"/><path d="M232 133 Q249 146 266 133" stroke="#36d6ee" stroke-width="4" fill="none"/><rect x="219" y="157" width="57" height="64" rx="15" fill="#d2e8ff" stroke="#526ca9" stroke-width="4"/><path d="M218 176 L185 205 M277 176 L309 205" stroke="#526ca9" stroke-width="12" stroke-linecap="round"/><circle cx="248" cy="183" r="12" fill="#4bcbe9"/>':'<rect x="202" y="75" width="72" height="147" rx="24" fill="#ef91b7" stroke="#b14f86" stroke-width="5"/><rect x="190" y="113" width="96" height="75" rx="19" fill="#f6b0ce" stroke="#b14f86" stroke-width="4"/><rect x="201" y="124" width="74" height="52" rx="12" fill="#263659"/><path d="M224 147 C224 131 240 138 238 148 C243 134 260 136 259 148 Q253 161 239 168 Q222 157 224 147" fill="#ff779a"/>';
const face='<circle cx="103" cy="138" r="39" fill="#ffd4b4"/><path d="M65 129 Q60 76 111 83 Q154 88 143 133 Q126 112 106 108 Q83 129 65 129" fill="#72442f"/><circle cx="90" cy="138" r="4" fill="#332a40"/><circle cx="116" cy="138" r="4" fill="#332a40"/><path d="M96 156 Q105 166 115 156" stroke="#a85b68" stroke-width="3" fill="none"/><path d="M83 181 Q105 170 130 181 L146 232 L61 232Z" fill="#f58ab4"/><path d="M134 191 L179 163" stroke="#f7c9a6" stroke-width="12" stroke-linecap="round"/><path d="M120 86 Q132 68 146 86 L133 99Z" fill="#ff71ae"/>';
return '<svg viewBox="0 0 360 240" role="img" aria-label="Illustrated story scene" xmlns="http://www.w3.org/2000/svg"><rect width="360" height="240" rx="20" fill="'+bg+'"/><circle cx="314" cy="45" r="26" fill="#fff" opacity=".75"/><rect x="13" y="24" width="335" height="206" rx="14" fill="none" stroke="#b6cce7" stroke-width="5"/><path d="M20 213 H340" stroke="#a6b3d5" stroke-width="5"/>'+face+object+'<text x="22" y="42" font-size="19" font-weight="bold" fill="#47558e">'+(robot?'ROBOT MUSEUM':'SMART WATCH STORE')+'</text><circle cx="'+(i%2?322:174)+'" cy="71" r="9" fill="#ffe18a"/></svg>'}
const stories=[{"title":"The Robot Museum","emoji":"🤖","lines":[["Hi Sara,","👋"],["How are you?","💌"],["I went to a technology museum yesterday.","🏛️"],["I saw a big robot next to the door.","🤖🚪"],["It was amazing and very smart.","✨🧠"],["The robot could talk and dance.","🕺🤖"],["I played with a small robot on the table.","🤖🪑"],["It was a fun day!","🎉"],["Do you like robots?","❓🤖"],["Your friend, Sakinah","💜"]]},{"title":"My New Smart Watch","emoji":"⌚","lines":[["Hi Sara,","👋"],["How are you?","💌"],["Yesterday, I went to a technology store.","🏬"],["I saw a beautiful smart watch on the table.","⌚"],["It was small and pink.","🩷⌚"],["It can tell the time and count my steps.","🕒👟"],["I really liked it!","😍"],["Do you have a smart watch?","❓⌚"],["Your friend, Sakinah","💜"]]}];let current=0,player=null,fontBoost=0;const savedKey="sakinah-tech-email-read-v1";let read=new Set(JSON.parse(localStorage.getItem(savedKey)||"[]"));function progress(){el("journey").textContent="⭐ "+read.size+" / 19 sentences practiced · Your progress is saved."}
const el=id=>document.getElementById(id);const tabs=el('tabs'),cards=el('cards');
function stop(){if(player){player.pause();player.removeAttribute('src');player=null}}
function play(i,status){stop();const voice=el('voice').value;const src='audio/kokoro/'+voice+'/technology-email-'+(current+1)+'-'+String(i+1).padStart(2,'0')+'.mp3';const a=new Audio(src);player=a;a.playbackRate=Number(el('speed').value);status.textContent='Loading recorded voice…';a.onplaying=()=>status.textContent='🔊 Listen and repeat!';a.onended=()=>status.textContent='⭐ Your turn to read!';a.onerror=()=>status.textContent='Recording not uploaded yet — audio unavailable.';a.play().catch(()=>status.textContent='Recording unavailable or playback blocked.');}
function draw(){stop();tabs.innerHTML='';stories.forEach((s,n)=>{let b=document.createElement('button');b.textContent=s.emoji+' '+s.title;b.className=n===current?'active':'';b.onclick=()=>{current=n;draw()};tabs.appendChild(b)});cards.innerHTML='';stories[current].lines.forEach(([line,emoji],i)=>{let card=document.createElement('article');card.className='card';let scene=document.createElement('div');scene.className='scene';scene.innerHTML=illustration(current,i);scene.setAttribute('role','img');scene.setAttribute('aria-label','Illustration for sentence '+(i+1));let sentence=document.createElement('div');sentence.className='sentence';sentence.textContent=line;sentence.style.fontSize='calc(clamp(21px,2.2vw,28px) + '+fontBoost+'px)';let controls=document.createElement('div');controls.className='buttons';let listen=document.createElement('button');listen.textContent='🔊 Listen';let zoom=document.createElement('button');zoom.className='secondary';zoom.textContent='🔎 Zoom';let status=document.createElement('div');status.className='status';listen.onclick=()=>play(i,status);zoom.onclick=scene.onclick=()=>{el('zoomart').innerHTML=illustration(current,i);el('zoomtext').textContent=line;el('modal').classList.add('open')};let done=document.createElement('button');done.className='secondary';done.textContent=read.has(current+'-'+i)?'⭐ Practiced':'☆ I read it!';done.onclick=()=>{read.add(current+'-'+i);localStorage.setItem(savedKey,JSON.stringify([...read]));done.textContent='⭐ Practiced';progress()};controls.append(listen,zoom,done);card.append(scene,sentence,controls,status);cards.appendChild(card)});progress()}
el('stop').onclick=stop;el('larger').onclick=()=>{fontBoost=(fontBoost+6)%24;draw()};el('close').onclick=()=>el('modal').classList.remove('open');el('modal').onclick=e=>{if(e.target===el('modal'))el('modal').classList.remove('open')};document.addEventListener('keydown',e=>{if(e.key==='Escape')el('modal').classList.remove('open')});window.addEventListener('pagehide',stop);draw();
</script></body></html>
