name: Import Aboud original sight-word JPEGs
on:
  push:
    paths:
      - '.github/workflows/import-aboud-sight-words.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download the unchanged original JPEG images
        run: |
          set -euo pipefail
          mkdir -p aboud/sight-words
          curl -fLsS --retry 2 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/068a4569-f0be-45c8-8e32-5f6526501bd0.jpg' -o aboud/sight-words/original-1.jpg
          curl -fLsS --retry 2 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/b80c314a-07dd-43c6-a6af-5a680a69289c.jpg' -o aboud/sight-words/original-2.jpg
          curl -fLsS --retry 2 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/c701d5d1-358f-4261-8522-228f7c824aaf.jpg' -o aboud/sight-words/original-3.jpg
          printf '%s\n' \
            '1984aa201d73d70ad1e24386c3add6c50b12f944b1abd63a5ca07ad7ec032e9e  aboud/sight-words/original-1.jpg' \
            'f465ff4e404afbe500d258254bd1d46f926eea3b6afbd12c508fad3226277a92  aboud/sight-words/original-2.jpg' \
            '79548fca38c1f1604b41a9844e78f7bc6ca447f464b6f174aae9784e33192c99  aboud/sight-words/original-3.jpg' 
             | sha256sum --check
      - name: Publish originals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aboud/sight-words/original-*.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Import unchanged Arabic sight-word photos for Aboud"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
