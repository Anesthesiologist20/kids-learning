<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kids Reading Studio</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f7f3ff;color:#28213f}main{max-width:1020px;margin:auto;padding:20px 14px 80px}h1{font-size:clamp(26px,4vw,42px)}button,select{font:inherit;min-height:46px;border-radius:12px}button{border:0;background:#6946b3;color:white;font-weight:750;padding:10px 15px;cursor:pointer}button.secondary{background:#eae2fa;color:#503488}button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible{outline:3px solid #ffb500;outline-offset:2px}.bar{background:white;border-radius:20px;padding:15px;display:flex;flex-wrap:wrap;gap:12px;align-items:end}.bar label{display:grid;gap:4px;font-weight:650}.bar select{padding:8px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px;margin-top:20px}.card{background:white;border:2px solid #e0d6f5;border-radius:20px;padding:15px}.card.practiced{border-color:#62bf92}.scene{aspect-ratio:16/10;background:#f3eaf9;border-radius:14px;overflow:hidden;cursor:zoom-in}.scene img{width:100%;height:100%;object-fit:contain}.sentence{font-size:clamp(21px,2.5vw,28px);font-weight:800;line-height:1.5;margin:16px 0}.actions{display:flex;flex-wrap:wrap;gap:8px}.actions button{flex:1}.count{color:#604a8d;font-weight:700;margin:10px 0}.status{font-size:14px;color:#685d75;min-height:23px}.overlay{display:none;position:fixed;inset:0;background:#130b26d9;z-index:20;align-items:center;justify-content:center;padding:10px}.overlay.open{display:flex}.reader{width:min(100%,900px);max-height:95dvh;overflow:auto;background:white;border-radius:24px;padding:clamp(12px,3vw,24px);text-align:center}.reader img{display:block;width:100%;max-height:54dvh;object-fit:contain;border-radius:14px}.reader .sentence{font-size:clamp(24px,4vw,38px)}.nav{display:flex;gap:8px}.nav button{flex:1;min-width:0;padding:10px 5px}.reader .top{display:flex;justify-content:space-between;align-items:center}.tag{background:#efe8ff;border-radius:30px;padding:6px 12px}.review{margin-top:15px}.hidden{display:none!important}@media(max-width:600px){.nav button{font-size:14px}.reader img{max-height:48dvh}}</style></head><body><main><h1 id="title"></h1><p>Read • Listen • Practice ⭐</p><div class="bar"><label>Teacher<select id="voice"></select></label><label>Speed<select id="speed"><option value=".75">Slow</option><option value="1" selected>Normal</option><option value="1.2">Fast</option></select></label><button class="secondary" id="review">Review needed</button><button class="secondary" id="all">Show all</button><span id="progress" role="status"></span></div><section class="cards" id="cards"></section></main><div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Reading focus mode"><div class="reader"><div class="top"><span class="tag" id="position"></span><button id="close">✕ Close</button></div><div id="picture"></div><div class="sentence" id="line"></div><div class="nav"><button id="prev">⬅ Previous</button><button id="read">🔊 Read</button><button id="next">Next ➡</button></div><div class="nav review"><button class="secondary" id="mark">☆ I Practiced</button><button class="secondary" id="need">⚑ Needs Practice</button></div><p class="status" id="readerStatus" role="status"></p></div></div><script>
// Replace this sample configuration for EACH lesson. Audio files must actually exist.
const LESSON={id:"sample-reading-v1",title:"Sample Reading Lesson",voices:["bella","heart","sarah"],scenes:[{text:"This is my first sentence.",image:"scene-01.webp",audio:"audio/{voice}/scene-01.mp3"},{text:"This is my second sentence.",image:"scene-02.webp",audio:"audio/{voice}/scene-02.mp3"}]};
const $=id=>document.getElementById(id),key="kids-reading-studio:"+LESSON.id;let state;try{state=JSON.parse(localStorage.getItem(key))||{}}catch{state={}}let index=0,player=null,onlyReview=false;function save(){localStorage.setItem(key,JSON.stringify(state))}function stop(){if(player){player.pause();player=null}}function src(scene){return scene.image||""}function img(scene){const im=document.createElement("img");im.src=src(scene);im.alt="Illustration for: "+scene.text;im.loading="lazy";im.onerror=()=>{im.alt="Illustration not uploaded";im.style.display="none"};return im}function audio(i,status){stop();const scene=LESSON.scenes[i];if(!scene.audio){status.textContent="Recording not available yet.";return}const url=scene.audio.replace("{voice}",$("voice").value);const a=new Audio(url);player=a;a.playbackRate=Number($("speed").value);status.textContent="Loading recording…";a.onplaying=()=>status.textContent="🔊 Listen and repeat";a.onended=()=>status.textContent="⭐ Your turn";a.onerror=()=>status.textContent="Recording not uploaded yet.";a.play().catch(()=>status.textContent="Unable to play recording.")}function mark(i,value){state[i]=value;save();draw();if($("overlay").classList.contains("open"))renderReader()}function draw(){$("cards").replaceChildren();LESSON.scenes.forEach((scene,i)=>{if(onlyReview&&state[i]!=="review")return;const card=document.createElement("article");card.className="card"+(state[i]==="done"?" practiced":"");const num=document.createElement("div");num.className="count";num.textContent="Sentence "+(i+1)+" of "+LESSON.scenes.length;const pic=document.createElement("div");pic.className="scene";pic.append(img(scene));pic.onclick=()=>open(i);const line=document.createElement("div");line.className="sentence";line.textContent=scene.text;const actions=document.createElement("div");actions.className="actions";const status=document.createElement("div");status.className="status";for(const [name,fn,cls] of [["🔊 Listen",()=>audio(i,status),""],["🔎 Zoom",()=>open(i),"secondary"],[state[i]==="done"?"⭐ Practiced":"☆ I Practiced",()=>mark(i,"done"),"secondary"],["⚑ Review",()=>mark(i,"review"),"secondary"]]){const b=document.createElement("button");b.textContent=name;b.className=cls;b.onclick=fn;actions.append(b)}card.append(num,pic,line,actions,status);$("cards").append(card)});$("progress").textContent="⭐ "+Object.values(state).filter(v=>v==="done").length+" / "+LESSON.scenes.length+" practiced"}function open(i){index=i;$("overlay").classList.add("open");renderReader();$("close").focus()}function renderReader(){stop();const scene=LESSON.scenes[index];$("picture").replaceChildren(img(scene));$("line").textContent=scene.text;$("position").textContent=(index+1)+" / "+LESSON.scenes.length;$("prev").disabled=index===0;$("next").disabled=index===LESSON.scenes.length-1;$("mark").textContent=state[index]==="done"?"⭐ Practiced":"☆ I Practiced";$("readerStatus").textContent=""}function move(delta){const n=index+delta;if(n>=0&&n<LESSON.scenes.length){index=n;renderReader()}}function close(){stop();$("overlay").classList.remove("open")}$("title").textContent=LESSON.title;for(const v of LESSON.voices){const o=document.createElement("option");o.value=v;o.textContent=v[0].toUpperCase()+v.slice(1);$("voice").append(o)}$("prev").onclick=()=>move(-1);$("next").onclick=()=>move(1);$("read").onclick=()=>audio(index,$("readerStatus"));$("mark").onclick=()=>mark(index,"done");$("need").onclick=()=>mark(index,"review");$("close").onclick=close;$("overlay").onclick=e=>{if(e.target===$("overlay"))close()};$("review").onclick=()=>{onlyReview=true;draw()};$("all").onclick=()=>{onlyReview=false;draw()};document.addEventListener("keydown",e=>{if(!$("overlay").classList.contains("open"))return;if(e.key==="Escape")close();if(e.key==="ArrowRight")move(1);if(e.key==="ArrowLeft")move(-1)});let touchX=null;$("overlay").addEventListener("touchstart",e=>{touchX=e.touches[0].clientX},{passive:true});$("overlay").addEventListener("touchend",e=>{if(touchX===null)return;const d=e.changedTouches[0].clientX-touchX;if(Math.abs(d)>65)move(d<0?1:-1);touchX=null},{passive:true});draw();</script></body></html>
