name: Raghd Sunday Layla Audio
on:
  push:
    branches: [main]
    paths:
      - 'raghd/sunday-assessment.html'
      - 'scripts/raghd_sunday_audio.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: raghd-sunday-voice
  cancel-in-progress: false

jobs:
  create-and-publish-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate all lesson recordings with ElevenLabs Layla
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python3 scripts/raghd_sunday_audio.py
      - name: Validate recordings and refresh PWA
        run: |
          python3 - <<'PY'
          import pathlib, re, importlib.util
          spec=importlib.util.spec_from_file_location("clips","scripts/raghd_sunday_audio.py")
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          for k in m.CLIPS:
              p=pathlib.Path("raghd/audio/sunday-"+k+".mp3")
              if not p.is_file() or p.stat().st_size<700:raise SystemExit("Missing "+str(p))
          sw_path=pathlib.Path("sw.js");sw=sw_path.read_text()
          found=re.search(r"const CACHE = 'kids-learning-pwa-v(\d+)';",sw)
          if not found:raise SystemExit("Cache version missing")
          sw=sw[:found.start(1)]+str(int(found.group(1))+1)+sw[found.end(1):]
          urls=["/kids-learning/raghd/sunday-assessment.html"]+["/kids-learning/raghd/audio/sunday-"+k+".mp3" for k in m.CLIPS]
          for u in urls:
              quote=" '"+u+"',"
              if quote not in sw:sw=sw.replace("const SHELL = [","const SHELL = [\n"+quote)
          sw_path.write_text(sw);print("Validated",len(m.CLIPS),"MP3s")
          PY
          git diff --check
      - name: Publish stable MP3s
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raghd/audio/sunday-*.mp3 sw.js
          if ! git diff --cached --quiet; then
            git commit -m "Publish Raghd Sunday Layla voice recordings"
            git pull --rebase origin main
            # Rebase because the lesson can be updated while ElevenLabs generates audio.
          # Do not force-push or overwrite lesson edits made after checkout.
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "ElevenLabs Layla audio published successfully."
              exit 0
            fi
            echo "Push raced with another commit; retrying ($attempt of 4)"
            sleep 4
          done
          echo "Could not publish generated ElevenLabs audio after four safe retries" >&2
          exit 1
          fi
