<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f6ff">
<meta name="description" content="Emilia’s New Year’s Adventure, page 40. Tap the picture to read, practise, and play.">
<title>Aboud · Emilia · Page 40</title>
<style>
*{box-sizing:border-box}
html{background:#f2f6ff}
body{margin:0;font:16px/1.5 system-ui,-apple-system,sans-serif;color:#26334b}
[hidden]{display:none!important}
main{width:100%;margin:0 auto;max-width:calc(100svh * 754 / 1024)}
.sheet{position:relative;width:100%;aspect-ratio:754/1024;overflow:hidden;isolation:isolate}
.art{display:block;width:100%;height:100%;pointer-events:none}
.hotspot{position:absolute;display:block;margin:0;padding:0;border:0;background:transparent;border-radius:12px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;color:transparent;font:inherit}
.hotspot::before{content:"";position:absolute;inset:-10px 0}
.hotspot:focus-visible{outline:3px solid #13274e;outline-offset:2px}
.hotspot:active{background:#ffffff55}
.hotspot[data-action="voice"]{border-radius:35%}
.hotspot[data-action="voice"][aria-pressed="true"]{box-shadow:inset 0 0 0 3px #a62c91}
.hotspot[data-action="speed"]{color:#27334b;background:#fbfdff;border:1px solid #dce1ef;font-size:clamp(7px,1.62vw,13px);font-weight:750;line-height:1;white-space:nowrap;border-radius:10px}
.hotspot[data-action="speed"][aria-pressed="true"]{background:#2e9dff;color:#fff;border-color:#2e9dff}
.hotspot[data-action="read"][aria-pressed="true"]{box-shadow:0 0 0 3px #fcbe20;background:#ffd34d55}
.hotspot[data-action="read"][aria-pressed="true"]::after{content:"Ⅱ";position:absolute;inset:0;display:grid;place-items:center;background:#e72c67e8;border-radius:12px;color:#fff;font-size:clamp(13px,2vw,24px);font-weight:900}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.toast{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#24365deb;color:#fff;border-radius:14px;padding:10px 16px;width:max-content;max-width:92vw;font-size:14px;text-align:center;z-index:10;pointer-events:none}
dialog{border:0;padding:22px;border-radius:22px;width:min(92vw,470px);max-height:85svh;overflow:auto;color:#26334b;background:#fff;box-shadow:0 15px 70px #101b5155}
dialog::backdrop{background:#15244988}
.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:22px;line-height:1.25;margin:0}
.close{border:0;background:#edf1f8;border-radius:50%;width:44px;height:44px;font:24px/1 system-ui;cursor:pointer;flex-shrink:0}
.dialog-text{font-size:20px;line-height:1.6;margin:18px 0}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.actions button,.option{border:1px solid #d6dff0;border-radius:13px;min-height:46px;padding:10px 16px;background:#eef3ff;color:#274883;font:700 16px/1.3 system-ui;cursor:pointer}
.actions button:disabled{opacity:.45;cursor:default}
.actions .record{background:#e9f5ff;color:#116aae}
.actions .record[aria-pressed="true"]{background:#ffe6eb;color:#c42d50}
.actions .done{background:#e6f5e6;color:#2c7134}
button:focus-visible,a:focus-visible{outline:3px solid #f3ac1a;outline-offset:3px}
.option{width:100%;display:block;text-align:left;margin:10px 0;background:#f4f6fc}
.option.correct{background:#daf2df;border-color:#49a25e;color:#246333}
.option.wrong{background:#fff0f0;border-color:#d46b76;color:#91303f}
.feedback{min-height:1.5em;font-size:16px;margin:15px 0 0}
#recording{width:100%;margin-top:16px}
@media(orientation:landscape) and (max-height:500px){main{max-width:none;width:min(100%,754px)}.hotspot[data-action="speed"]{font-size:clamp(8px,1.8vw,13px)}}
@media(prefers-reduced-motion:no-preference){.hotspot{transition:background-color .15s,box-shadow .15s}}
</style>
</head>
<body>
<main aria-label="Emilia’s New Year’s Adventure, page 40">
  <div class="sheet" id="sheet">
    <!-- The original image is unchanged. This viewBox shows only page 40, at its original proportions. -->
    <svg class="art" viewBox="0 0 754 1024" role="img" aria-labelledby="artTitle artDescription">
      <title id="artTitle">Emilia’s New Year’s Adventure · Page 40</title>
      <desc id="artDescription">Six illustrated scenes: Emilia on the sofa, a boring party, second grade, mysteries, detective stories, and becoming a detective. Choose a reader and speed, then use the Read, Say, and Quiz buttons on each scene.</desc>
      <image href="IMG_6012.png" width="1536" height="1024"/>
    </svg>
    <div id="buttons"></div>
  </div>
</main>
<p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
<div id="toast" class="toast" hidden></div>
<audio id="reader" preload="none" playsinline></audio>
<dialog id="practice" aria-labelledby="practiceTitle">
  <div class="dialog-head"><h1 id="practiceTitle">🎤 Your turn</h1><button class="close" data-close="practice" aria-label="Close speaking practice">×</button></div>
  <p id="practiceText" class="dialog-text"></p>
  <div class="actions">
    <button id="practiceListen">🔊 Listen</button>
    <button id="record" class="record" aria-pressed="false">🎙 Record</button>
    <button id="practiceDone" class="done">✓ I said it</button>
  </div>
  <audio id="recording" controls playsinline hidden></audio>
  <p id="practiceFeedback" class="feedback" role="status">Read aloud. Record to hear yourself.</p>
</dialog>
<dialog id="quiz" aria-labelledby="quizTitle">
  <div class="dialog-head"><h1 id="quizTitle">🔎 Quick quiz</h1><button class="close" data-close="quiz" aria-label="Close quiz">×</button></div>
  <p id="question" class="dialog-text"></p>
  <div id="answers"></div>
  <p id="quizFeedback" class="feedback" role="status"></p>
</dialog>
<script>
'use strict';
const ART_WIDTH=754,ART_HEIGHT=1024;
const PANELS=[
 {clips:[0,1],text:'Emilia is sitting on the sofa. She’s looking out the window.',question:'Where is Emilia sitting?',answers:['On the sofa','At school'],correct:0},
 {clips:[2,3],text:'“I’m so bored!” she thinks. It’s her parents’ New Year’s Eve party.',question:'How does Emilia feel?',answers:['Excited','Bored'],correct:1},
 {clips:[4],text:'“How’s second grade?” asks a neighbor.',question:'Which grade is Emilia in?',answers:['Second grade','Fourth grade'],correct:0},
 {clips:[5],text:'“Any mysteries?” asks another.',question:'What does the guest ask about?',answers:['Birthdays','Mysteries'],correct:1},
 {clips:[6,7],text:'Emilia loves detective games. She likes reading detective stories, too.',question:'What does Emilia like reading?',answers:['Detective stories','Recipes'],correct:0},
 {clips:[8],text:'She wants to be a famous detective!',question:'What does Emilia want to be?',answers:['A singer','A detective'],correct:1}
];
// Measured against the original 1536 × 1024 image, with the right page outside the viewport.
const ROW_Y=[405,686,916];
const BUTTON_RECTS=[[[39,90],[163,89],[288,91]],[[432,85],[537,83],[640,85]]];
const VOICES=[['bella','Bella',428,99],['heart','Heart',533,96],['sarah','Sarah',637,99]];
const SPEEDS=[['0.7','🐌 Very Slow',420,121],['0.85','🐢 Slow',544,90],['1','🐇 Normal',639,100]];
const $=id=>document.getElementById(id);
const reader=$('reader');
let voice='bella',speed='0.7',activePanel=-1,playToken=0,practicePanel=0,quizPanel=0;
let toastTimer,recordTimer,stream=null,recorder=null,recordUrl=null,recordSession=0;
try{const saved=JSON.parse(localStorage.getItem('aboud-emilia-picture-settings-v2')||'null');if(saved){if(VOICES.some(v=>v[0]===saved.voice))voice=saved.voice;if(SPEEDS.some(s=>s[0]===saved.speed))speed=saved.speed;}}catch(_){}
function say(message,visible=false){$('announcement').textContent=message;if(visible){clearTimeout(toastTimer);$('toast').textContent=message;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,3300);}}
function saveSettings(){try{localStorage.setItem('aboud-emilia-picture-settings-v2',JSON.stringify({voice,speed}));}catch(_){} }
function addButton(action,value,x,y,w,h,label,visibleText=''){
 const button=document.createElement('button');button.type='button';button.className='hotspot';button.dataset.action=action;button.dataset.value=String(value);button.setAttribute('aria-label',label);button.title=label;
 Object.assign(button.style,{left:x/ART_WIDTH*100+'%',top:y/ART_HEIGHT*100+'%',width:w/ART_WIDTH*100+'%',height:h/ART_HEIGHT*100+'%'});
 if(['voice','speed','read'].includes(action))button.setAttribute('aria-pressed','false');
 if(action==='say'||action==='quiz')button.setAttribute('aria-haspopup','dialog');
 if(visibleText)button.textContent=visibleText;
 $('buttons').append(button);
}
VOICES.forEach(([key,name,x,w])=>addButton('voice',key,x,8,w,98,'Choose '+name));
SPEEDS.forEach(([value,label,x,w])=>addButton('speed',value,x,116,w,40,label,label));
PANELS.forEach((panel,index)=>{
 const column=index%2,row=Math.floor(index/2);
 ['read','say','quiz'].forEach((action,k)=>{const [x,w]=BUTTON_RECTS[column][k];addButton(action,index,x,ROW_Y[row],w,38,(action==='read'?'Read':action==='say'?'Practise':'Quiz on')+' scene '+(index+1)+': '+panel.text);});
});
// The printed Previous Page control returns to Aboud; no second page or duplicate cards are mounted.
const back=document.createElement('a');back.className='hotspot';back.href='./';back.setAttribute('aria-label','Back to Aboud’s learning corner');back.title='Back to Aboud’s learning corner';Object.assign(back.style,{left:33/ART_WIDTH*100+'%',top:970/ART_HEIGHT*100+'%',width:197/ART_WIDTH*100+'%',height:44/ART_HEIGHT*100+'%'});$('buttons').append(back);
function updateSelection(){document.querySelectorAll('[data-action="voice"],[data-action="speed"]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.value===(button.dataset.action==='voice'?voice:speed))));}
function clearPlaying(){document.querySelectorAll('[data-action="read"]').forEach(b=>b.setAttribute('aria-pressed','false'));$('practiceListen').textContent='🔊 Listen';activePanel=-1;}
function stopReading(){playToken++;reader.onended=null;reader.onerror=null;reader.pause();reader.removeAttribute('src');reader.load();clearPlaying();}
function readPanel(index){
 if(activePanel===index){stopReading();say('Stopped.');return;}
 stopReading();$('recording').pause();const panel=PANELS[index],token=playToken,chosenVoice=voice;let cursor=0;activePanel=index;
 const button=document.querySelector('[data-action="read"][data-value="'+index+'"]');if(button)button.setAttribute('aria-pressed','true');
 if($('practice').open)$('practiceListen').textContent='⏹ Stop';
 const fail=()=>{if(token!==playToken)return;stopReading();say('The recording could not play. Tap Read to try again.',true);};
 function next(){
  if(token!==playToken)return;
  if(cursor===panel.clips.length){reader.onended=null;reader.onerror=null;clearPlaying();say('Your turn. Read it aloud.');return;}
  const clip=panel.clips[cursor++];reader.src='audio/emilia/'+chosenVoice+'/line-'+clip+'.mp3';reader.playbackRate=Number(speed);reader.preservesPitch=true;reader.onended=next;reader.onerror=fail;
  try{const playing=reader.play();if(playing&&playing.catch)playing.catch(fail);}catch(_){fail();}
 }
 say('Reading scene '+(index+1)+' with '+chosenVoice+'.');next();
}
function showDialog(id){const dialog=$(id);if(typeof dialog.showModal==='function')dialog.showModal();else{dialog.setAttribute('open','');dialog.style.position='fixed';dialog.style.inset='10% 0 auto';dialog.style.zIndex='20';}}
function finishRecording(discard=false){
 clearTimeout(recordTimer);if(discard||!recorder)recordSession++;
 if(recorder&&recorder.state!=='inactive'){if(discard){recorder.ondataavailable=null;recorder.onstop=null;}try{recorder.stop();}catch(_){} }
 if(stream){stream.getTracks().forEach(track=>track.stop());stream=null;}
 recorder=null;$('record').textContent='🎙 Record';$('record').setAttribute('aria-pressed','false');$('record').disabled=false;
}
function clearRecording(){finishRecording(true);$('recording').pause();$('recording').removeAttribute('src');$('recording').hidden=true;if(recordUrl){URL.revokeObjectURL(recordUrl);recordUrl=null;}}
function closeDialog(id){stopReading();if(id==='practice')clearRecording();const dialog=$(id);if(typeof dialog.close==='function')dialog.close();else dialog.removeAttribute('open');}
function openPractice(index){stopReading();clearRecording();practicePanel=index;$('practiceText').textContent=PANELS[index].text;$('practiceFeedback').textContent='Read aloud. Record to hear yourself.';showDialog('practice');}
async function recordPractice(){
 if(recorder&&recorder.state==='recording'){finishRecording();return;}
 stopReading();clearRecording();
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||typeof MediaRecorder==='undefined'){$('practiceFeedback').textContent='Recording is unavailable here. Open this page in Safari or Chrome, or practise aloud and tap “I said it”.';return;}
 const session=recordSession;$('record').disabled=true;$('practiceFeedback').textContent='Allow the microphone to record your voice.';
 try{
  const input=await navigator.mediaDevices.getUserMedia({audio:true});
  if(session!==recordSession||!$('practice').open){input.getTracks().forEach(track=>track.stop());return;}
  stream=input;const current=new MediaRecorder(input),chunks=[];recorder=current;
  current.ondataavailable=event=>{if(event.data.size)chunks.push(event.data);};
  current.onstop=()=>{if(session!==recordSession||!$('practice').open||!chunks.length)return;const blob=new Blob(chunks,{type:current.mimeType||chunks[0].type});recordUrl=URL.createObjectURL(blob);$('recording').src=recordUrl;$('recording').hidden=false;$('practiceFeedback').textContent='Listen to your recording, then compare it with the reader.';};
  current.onerror=()=>{finishRecording(true);$('practiceFeedback').textContent='Recording stopped. You can try again.';};
  current.start();$('record').disabled=false;$('record').textContent='■ Stop recording';$('record').setAttribute('aria-pressed','true');$('practiceFeedback').textContent='Listening… Read the scene aloud.';
  recordTimer=setTimeout(()=>finishRecording(),30000);
 }catch(error){if(session!==recordSession)return;finishRecording(true);$('practiceFeedback').textContent=error.name==='NotAllowedError'?'Microphone access was not allowed. You can still practise aloud.':'The microphone could not start. Try again or practise aloud.';}
}
function openQuiz(index){stopReading();quizPanel=index;const panel=PANELS[index];$('question').textContent=panel.question;$('answers').replaceChildren();$('quizFeedback').textContent='';panel.answers.forEach((text,value)=>{const button=document.createElement('button');button.type='button';button.className='option';button.dataset.answer=String(value);button.textContent=text;$('answers').append(button);});showDialog('quiz');}
$('buttons').addEventListener('click',event=>{
 const button=event.target.closest('button[data-action]');if(!button)return;const {action,value}=button.dataset;
 if(action==='voice'){stopReading();voice=value;saveSettings();updateSelection();say(VOICES.find(v=>v[0]===voice)[1]+' selected.',true);}
 else if(action==='speed'){speed=value;reader.playbackRate=Number(speed);saveSettings();updateSelection();say(SPEEDS.find(s=>s[0]===speed)[1]+' selected.',true);}
 else if(action==='read')readPanel(Number(value));
 else if(action==='say')openPractice(Number(value));
 else if(action==='quiz')openQuiz(Number(value));
});
$('practiceListen').onclick=()=>{finishRecording();readPanel(practicePanel);};
$('record').onclick=recordPractice;
$('practiceDone').onclick=()=>{closeDialog('practice');say('Practice complete ✓',true);};
$('answers').onclick=event=>{const button=event.target.closest('[data-answer]');if(!button||button.disabled)return;const correct=Number(button.dataset.answer)===PANELS[quizPanel].correct;button.classList.add(correct?'correct':'wrong');$('quizFeedback').textContent=correct?'Correct! ✓':'Read the picture and try again.';if(correct)$('answers').querySelectorAll('button').forEach(b=>b.disabled=true);else button.disabled=true;};
document.querySelectorAll('[data-close]').forEach(button=>button.onclick=()=>closeDialog(button.dataset.close));
['practice','quiz'].forEach(id=>{const dialog=$(id);dialog.addEventListener('cancel',()=>{stopReading();if(id==='practice')clearRecording();});dialog.addEventListener('close',()=>{stopReading();if(id==='practice')clearRecording();});dialog.addEventListener('click',event=>{if(event.target===dialog){const rect=dialog.getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)closeDialog(id);}});});
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopReading();finishRecording(true);}});
window.addEventListener('pagehide',()=>{stopReading();clearRecording();});
updateSelection();
</script>
</body>
</html>
