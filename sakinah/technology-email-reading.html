<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sakinah • Technology Email Reading</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f3ff;color:#292446;font-family:system-ui,-apple-system,sans-serif}header{background:#6148b1;color:white;padding:16px 4%;display:flex;justify-content:space-between;gap:12px;align-items:center}header a{color:white}main{max-width:1150px;margin:auto;padding:22px 16px 70px}h1{font-size:clamp(28px,4vw,46px);margin:10px 0}p{line-height:1.5}.controls{display:flex;gap:12px;flex-wrap:wrap;background:white;border-radius:20px;padding:16px;margin:18px 0;align-items:end}label{font-weight:700;display:grid;gap:6px}select,button{font:inherit;min-height:48px;border-radius:12px;padding:9px 14px}select{border:2px solid #d5c9f3;background:white}button{border:0;background:#6c4db7;color:white;font-weight:800;cursor:pointer}button.secondary{background:#ece5ff;color:#513698}.tabs{display:flex;gap:10px;flex-wrap:wrap}.tabs button.active{background:#263c80}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:18px;margin-top:18px}.card{background:white;border:2px solid #e3daf8;border-radius:22px;padding:16px;box-shadow:0 5px 16px #35236710}.scene{width:100%;height:185px;border-radius:16px;background:linear-gradient(135deg,#eee7ff,#dcf4ff);display:grid;place-items:center;font-size:76px;cursor:zoom-in}.sentence{font-size:clamp(21px,2.2vw,28px);font-weight:750;min-height:90px;line-height:1.45;margin:16px 0}.buttons{display:flex;flex-wrap:wrap;gap:8px}.buttons button{flex:1}.status{font-size:13px;color:#735d89;min-height:22px;margin-top:10px}.modal{position:fixed;inset:0;background:#17132be9;display:none;z-index:10;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.zoom{background:white;border-radius:25px;width:min(95vw,900px);padding:25px;text-align:center}.zoom .art{font-size:clamp(120px,25vw,240px);background:#eee8ff;border-radius:20px}.zoom p{font-size:clamp(26px,5vw,48px);font-weight:800}.hint{font-size:14px;color:#66577f} @media(min-width:700px){.grid{grid-template-columns:repeat(2,1fr)}} </style></head><body>
<header><b>🌷 Sakinah's Reading Adventure</b><a href="index.html">← Sakinah Home</a></header><main><h1>💌 Technology Email Reading</h1><p>Look at the picture. Listen. Read aloud. Zoom in to see more!</p><div class="tabs" id="tabs"></div><div class="controls"><label>Teacher voice<select id="voice"><option value="bella">🌸 Bella</option><option value="heart">💜 Heart</option><option value="sarah">⭐ Sarah</option></select></label><label>Reading speed<select id="speed"><option value=".7">🐢 Extra slow</option><option value=".85" selected>🌿 Slow</option><option value="1">🙂 Normal</option></select></label><button class="secondary" id="stop">⏹ Stop</button><button class="secondary" id="larger">A+ Bigger text</button></div><p class="hint">Audio uses recorded Kokoro AI voices, never browser speech. New recordings must be uploaded before playback becomes available.</p><section class="grid" id="cards"></section></main><div class="modal" id="modal" role="dialog" aria-modal="true"><div class="zoom"><button id="close">✕ Close</button><div class="art" id="zoomart"></div><p id="zoomtext"></p></div></div><script>
const stories=[{"title":"The Robot Museum","emoji":"🤖","lines":[["Hi Sara,","👋"],["How are you?","💌"],["I went to a technology museum yesterday.","🏛️"],["I saw a big robot next to the door.","🤖🚪"],["It was amazing and very smart.","✨🧠"],["The robot could talk and dance.","🕺🤖"],["I played with a small robot on the table.","🤖🪑"],["It was a fun day!","🎉"],["Do you like robots?","❓🤖"],["Your friend, Sakinah","💜"]]},{"title":"My New Smart Watch","emoji":"⌚","lines":[["Hi Sara,","👋"],["How are you?","💌"],["Yesterday, I went to a technology store.","🏬"],["I saw a beautiful smart watch on the table.","⌚"],["It was small and pink.","🩷⌚"],["It can tell the time and count my steps.","🕒👟"],["I really liked it!","😍"],["Do you have a smart watch?","❓⌚"],["Your friend, Sakinah","💜"]]}];let current=0,player=null,fontBoost=0;
const el=id=>document.getElementById(id);const tabs=el('tabs'),cards=el('cards');
function stop(){if(player){player.pause();player.removeAttribute('src');player=null}}
function play(i,status){stop();const voice=el('voice').value;const src='audio/kokoro/'+voice+'/technology-email-'+(current+1)+'-'+String(i+1).padStart(2,'0')+'.mp3';const a=new Audio(src);player=a;a.playbackRate=Number(el('speed').value);status.textContent='Loading recorded voice…';a.onplaying=()=>status.textContent='🔊 Listen and repeat!';a.onended=()=>status.textContent='⭐ Your turn to read!';a.onerror=()=>status.textContent='Recording not uploaded yet — audio unavailable.';a.play().catch(()=>status.textContent='Recording unavailable or playback blocked.');}
function draw(){stop();tabs.innerHTML='';stories.forEach((s,n)=>{let b=document.createElement('button');b.textContent=s.emoji+' '+s.title;b.className=n===current?'active':'';b.onclick=()=>{current=n;draw()};tabs.appendChild(b)});cards.innerHTML='';stories[current].lines.forEach(([line,emoji],i)=>{let card=document.createElement('article');card.className='card';let scene=document.createElement('div');scene.className='scene';scene.textContent=emoji;scene.setAttribute('role','img');scene.setAttribute('aria-label','Illustration for sentence '+(i+1));let sentence=document.createElement('div');sentence.className='sentence';sentence.textContent=line;sentence.style.fontSize='calc(clamp(21px,2.2vw,28px) + '+fontBoost+'px)';let controls=document.createElement('div');controls.className='buttons';let listen=document.createElement('button');listen.textContent='🔊 Listen';let zoom=document.createElement('button');zoom.className='secondary';zoom.textContent='🔎 Zoom';let status=document.createElement('div');status.className='status';listen.onclick=()=>play(i,status);zoom.onclick=scene.onclick=()=>{el('zoomart').textContent=emoji;el('zoomtext').textContent=line;el('modal').classList.add('open')};controls.append(listen,zoom);card.append(scene,sentence,controls,status);cards.appendChild(card)})}
el('stop').onclick=stop;el('larger').onclick=()=>{fontBoost=(fontBoost+6)%24;draw()};el('close').onclick=()=>el('modal').classList.remove('open');el('modal').onclick=e=>{if(e.target===el('modal'))el('modal').classList.remove('open')};document.addEventListener('keydown',e=>{if(e.key==='Escape')el('modal').classList.remove('open')});window.addEventListener('pagehide',stop);draw();
</script></body></html>
