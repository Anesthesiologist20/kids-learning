name: Sakinah Medicine Reading — Kokoro Heart and Bella
on:
  push:
    paths:
      - '.github/workflows/sakinah-medicine-audio.yml'
      - 'scripts/generate_sakinah_medicine_audio.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sakinah-medicine-voices
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        voice: [heart, bella]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kokoro audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg
          python -m pip install 'kokoro>=0.9.4,<1.0' soundfile numpy
      - name: Render and verify 24 recordings
        run: python scripts/generate_sakinah_medicine_audio.py ${{ matrix.voice }}
      - name: Publish generated MP3 files
        env:
          VOICE: ${{ matrix.voice }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "sakinah/audio/kokoro/$VOICE/medicine-"*.mp3
          if git diff --cached --quiet; then
            echo "Already up to date"
            exit 0
          fi
          git commit -m "audio(sakinah): Kokoro medicine readings ($VOICE)"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            if git push origin HEAD:main; then
              echo "Published $VOICE"
              exit 0
            fi
            sleep 4
          done
          exit 1
