name: Emilia Reading Plus Audio
on:
  push:
    paths:
      - 'aboud/emilia-plus-audio-manifest.json'
      - 'scripts/generate_emilia_plus_audio.py'
      - '.github/workflows/emilia-plus-audio.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        voice: [bella, heart, sarah]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg
          python -m pip install 'kokoro>=0.9.2,<1.0' soundfile numpy
      - name: Generate recordings
        run: python scripts/generate_emilia_plus_audio.py ${{ matrix.voice }}
      - name: Publish audio
        env:
          VOICE: ${{ matrix.voice }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "aboud/audio/emilia-plus/$VOICE/"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Emilia Reading Plus recordings ($VOICE)"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            if git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          exit 1
