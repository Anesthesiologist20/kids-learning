name: Import Raghd position voice
on:
  push:
    paths:
      - '.github/workflows/raghd-position-audio.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p raghd/audio
          curl --fail --location --silent --show-error 'https://storage.googleapis.com/xi-backend/database/workspace/a4af392c7dc949359a0169dbd75bff56/content_generation/PRj9VG12lux7VszijEj5/sypzLWd9QOGqRsa4fp91/content.mp3?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=xi-backend-prod%40xi-labs.iam.gserviceaccount.com%2F20261011%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20261011T084843Z&X-Goog-Expires=7200&X-Goog-SignedHeaders=host&X-Goog-' --output 'raghd/audio/farm.mp3'
          curl --fail --location --silent --show-error 'https://storage.googleapis.com/xi-backend/database/workspace/a4af392c7dc949359a0169dbd75bff56/content_generation/nIjFDKWtNlfUJ7urqteM/phLGG9WYKZ6KwIaSkmNN/content.mp3?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=xi-backend-prod%40xi-labs.iam.gserviceaccount.com%2F20261011%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20261011T084845Z&X-Goog-Expires=7200&X-Goog-SignedHeaders=host&X-Goog-' --output 'raghd/audio/scale.mp3'
          curl --fail --location --silent --show-error 'https://storage.googleapis.com/xi-backend/database/workspace/a4af392c7dc949359a0169dbd75bff56/content_generation/VeD8Zr3yuR60w9mYjRc9/aKdyVFWj8n87J3fzGVCW/content.mp3?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=xi-backend-prod%40xi-labs.iam.gserviceaccount.com%2F20261011%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20261011T084847Z&X-Goog-Expires=7200&X-Goog-SignedHeaders=host&X-Goog-' --output 'raghd/audio/banana.mp3'
          curl --fail --location --silent --show-error 'https://storage.googleapis.com/xi-backend/database/workspace/a4af392c7dc949359a0169dbd75bff56/content_generation/brMz0z3LF7KB0nB0AgWe/CcoSnxPx06kac2NS9D2O/content.mp3?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=xi-backend-prod%40xi-labs.iam.gserviceaccount.com%2F20261011%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20261011T084851Z&X-Goog-Expires=7200&X-Goog-SignedHeaders=host&X-Goog-' --output 'raghd/audio/bread.mp3'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add raghd/audio
          git diff --cached --quiet || git commit -m 'Add Raghd new position vocabulary audio'
          git push
