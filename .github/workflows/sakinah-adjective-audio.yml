name: Sakinah Adjective AI Audio
on:
  push:
    paths:
      - '.github/workflows/sakinah-adjective-audio.yml'
      - 'sakinah/adjective-audio-manifest.json'
      - 'scripts/generate_adjective_audio.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  voices:
    name: Generate ${{ matrix.voice }} pronunciation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        voice: [bella, heart, sarah]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kokoro and MP3 encoder
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg
          python -m pip install --upgrade pip
          python -m pip install 'kokoro>=0.9.2,<1.0' soundfile numpy
      - name: Produce each short AI voice clip
        run: python scripts/generate_adjective_audio.py ${{ matrix.voice }}
      - name: Publish with non-destructive rebase retries
        env:
          VOICE: ${{ matrix.voice }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "sakinah/audio/adjective/$VOICE/"
          if git diff --cached --quiet; then
            echo 'All files already present.'
            exit 0
          fi
          git commit -m "Audio: segmented adjective lessons ($VOICE)"
          for attempt in 1 2 3 4 5 6 7 8; do
            echo "Safe push attempt $attempt / 8"
            git fetch origin main
            if ! git rebase origin/main; then
              echo 'Rebase conflict; not overwriting remote files.'
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Successfully published $VOICE"
              exit 0
            fi
            sleep 4
          done
          echo 'Audio generation succeeded but GitHub publish could not complete.'
          exit 1
