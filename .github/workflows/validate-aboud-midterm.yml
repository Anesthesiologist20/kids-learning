name: Validate Aboud Mid-Term Exams
on:
  push:
    paths:
      - 'aboud/midterm-*'
      - 'aboud/index.html'
      - 'scripts/validate-aboud-midterm.js'
      - '.github/workflows/validate-aboud-midterm.yml'
  pull_request:
    paths:
      - 'aboud/midterm-*'
      - 'aboud/index.html'
      - 'scripts/validate-aboud-midterm.js'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check all 135 questions, source pages and page links
        run: node scripts/validate-aboud-midterm.js
