name: Raghd Sunday Voice Studio — Amy & Layla
on:
  push:
    branches: [main]
    paths:
      - scripts/raghd_sunday_audio.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: raghd-sunday-voice
  cancel-in-progress: false
jobs:
  audio-studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Produce both children's teacher voices
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python3 scripts/raghd_sunday_audio.py
      - name: Validate every clip and update the offline cache
        run: |
          python3 - <<'PY'
          import pathlib, re, importlib.util
          spec=importlib.util.spec_from_file_location("raghd","scripts/raghd_sunday_audio.py")
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          folder=pathlib.Path("raghd/audio")
          for voice in m.VOICES:
              for name in m.CLIPS:
                  file=folder / ("sunday-"+voice+"-"+name+".mp3")
                  if not file.is_file() or file.stat().st_size<700:
                      raise SystemExit("Missing or corrupt audio: "+str(file))
          source=pathlib.Path("sw.js")
          sw=source.read_text()
          match=re.search(r"const CACHE = 'kids-learning-pwa-v(\d+)';",sw)
          if not match:raise SystemExit("Service worker cache version not found")
          sw=sw[:match.start(1)]+str(int(match.group(1))+1)+sw[match.end(1):]
          # The legacy voice clips must never be served to the child by mistake.
          lines=sw.splitlines()
          lines=[line for line in lines if not re.search(r"'/kids-learning/raghd/audio/sunday-(?!amy-|layla-)[^']+\.mp3'",line)]
          sw="\n".join(lines)+"\n"
          assets=["/kids-learning/raghd/sunday-assessment.html",
              "/kids-learning/raghd/sunday-core.js",
              "/kids-learning/raghd/sunday-test.js",
              "/kids-learning/raghd/sunday.css"]
          assets += ["/kids-learning/raghd/audio/sunday-"+v+"-"+k+".mp3"
               for v in m.VOICES for k in m.CLIPS]
          for url in assets:
              fragment=" '"+url+"',"
              if fragment not in sw:sw=sw.replace("const SHELL = [","const SHELL = [\n"+fragment)
          source.write_text(sw)
          print("Validated "+str(len(m.CLIPS)*len(m.VOICES))+" new ElevenLabs MP3 recordings; PWA cache refreshed.")
          PY
          git diff --check
      - name: Safely publish newly rendered MP3 files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Remove old single-voice audio only when both new voices are ready.
          for old in raghd/audio/sunday-*.mp3; do
            case "$old" in
              raghd/audio/sunday-amy-*|raghd/audio/sunday-layla-*) ;;
              *) git rm --ignore-unmatch -- "$old" ;;
            esac
          done
          git add raghd/audio/ sw.js
          if git diff --cached --quiet; then
            echo "All recordings are already current."
            exit 0
          fi
          git commit -m "Publish refreshed Raghd Amy and Layla dual-voice recordings"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Published all Raghd ElevenLabs voice recordings."
              exit 0
            fi
            sleep 3
          done
          echo "Could not push audio after five attempts." >&2
          exit 1
