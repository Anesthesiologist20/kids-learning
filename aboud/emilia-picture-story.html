<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aboud · Emilia Illustrated Reading</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f6ff;color:#24334f;font:clamp(16px,2vw,21px)/1.55 system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:14px}a{color:#355a9a}header{background:linear-gradient(120deg,#55429c,#244c92);color:white;border-radius:20px;padding:20px}h1{font-size:clamp(27px,4vw,44px);margin:6px 0}.toolbar{display:flex;flex-wrap:wrap;align-items:end;gap:12px;background:#fff;padding:15px;border-radius:16px;margin:14px 0}label{display:grid;gap:4px;font-weight:750}button,select{font:inherit;border:1px solid #d1d9eb;border-radius:12px;padding:9px 12px;min-height:45px;cursor:pointer}button{background:#e9ecff;color:#354d89;font-weight:800}.primary{background:#f23c76;color:white;border:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.story{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 5px 18px #283b6c16}.scene{height:220px;display:grid;place-items:center;position:relative;background:linear-gradient(140deg,#fee5a9,#b6d9fa);font-size:4.5rem}.scene svg{width:100%;height:100%;object-fit:cover}.scene small{position:absolute;bottom:10px;left:12px;font-size:.75rem;color:#223c69;background:#ffffffda;padding:3px 9px;border-radius:20px}.words{padding:14px}.words p{margin:0 0 12px;font-weight:650}.controls{display:flex;flex-wrap:wrap;gap:8px}.playing{outline:4px solid #ffca75}.pages{display:flex;justify-content:space-between;gap:8px;margin:15px 0}.pages button.selected{background:#3757ae;color:white}.status{font-size:.82rem;color:#68528e;flex-basis:100%}.quiz{background:white;padding:18px;border-radius:16px;margin:18px 0}.quiz button{margin:4px}.correct{background:#daf3e5}.wrong{background:#ffdde4}@media(max-width:650px){.grid{grid-template-columns:1fr}.scene{height:160px}.toolbar label{flex:1}}</style></head><body><main><a href="./">← Aboud's corner</a><header><h1>📚 Emilia's New Year's Adventure</h1><p>Illustrated story · Pages 40–41 · One sentence, one listen button · Read with Aboud!</p></header><div class="toolbar"><label>🎙️ Teacher<select id="voice"><option value="bella">Bella 🌸</option><option value="heart">Heart 💜</option><option value="sarah">Sarah ⭐</option></select></label><label>🐢 Speed<select id="speed"><option value="0.7">Very slow</option><option value="0.85" selected>Slow</option><option value="1">Normal</option></select></label><button id="try">▶ Test voice</button><button id="stop">⏹ Stop</button><div class="status" id="status" role="status">Tap Read to hear one sentence, then repeat it aloud.</div></div><div class="pages"><button data-page="0" class="selected">📖 Page 40</button><button data-page="1">📖 Page 41</button></div><div class="grid" id="cards"></div><div class="quiz"><h2>🕵️ Detective Quiz</h2><p id="question"></p><div id="options"></div><p id="feedback"></p><button id="next">Next question →</button></div></main><script>const P=[["Emilia is sitting on the sofa.","She’s looking out the window.","I’m so bored!","It’s her parents’ New Year’s Eve party.","How’s second grade?","Any mysteries?","Emilia loves detective games.","She likes reading detective stories, too.","She wants to be a famous detective!","Why don’t you try out your new binoculars?","What a great idea!","I have them in my room.","Emilia gets her binoculars and goes outside.","She’s very excited."],["Emilia is outside looking through the binoculars.","Suddenly, she hears a noise!","She’s scared.","Then, the garden shed door opens.","Who’s there?","Emilia runs into the house.","Dad!","There’s someone in the yard!","Not now, Emilia.","It’s almost midnight.","Emilia looks around.","Everyone is standing in a circle holding hands.","It’s almost midnight.","The new year is coming!","Ten, nine, eight, seven ...","Oh, no!","I have to do something!"]];const S=["Emilia sitting on a yellow sofa at a New Year's Eve party","Emilia looking bored at a festive party with adults chatting","Guests talking to Emilia at the party","A guest asking Emilia about mysteries","Emilia imagining being a detective, magnifying glass and mystery books","Emilia getting binoculars from her room","Emilia walking into the moonlit garden with binoculars","Emilia hears a noise and looks startled outside","A wooden garden shed door opening in the night","Emilia rushing inside to find Dad","Dad waiting for the midnight countdown with the guests","Guests holding hands in a circle near midnight","A happy new year banner and countdown clock","Emilia remembering she must investigate the mystery"];const E=["🛋️","😑","🎉","❓","🔎","🔭","🌙","😱","🏚️","🏃‍♀️","👨","🧑‍🤝‍🧑","🕛","🎆"];const $=id=>document.getElementById(id);let pg=0,audio=null,q=0;const Q=[["Why is Emilia bored?",["She is at a party.","She is at school."],0],["What does Emilia want to become?",["A detective","A singer"],0],["What does Mom give Emilia?",["Binoculars","A football"],0],["What opens in the garden?",["A shed door","A car door"],0],["Why is Dad busy?",["It is almost midnight.","He is asleep."],0]];function stop(){if(audio){audio.pause();audio.src="";audio=null}document.querySelectorAll(".playing").forEach(e=>e.classList.remove("playing"))}function play(i,el){stop();audio=new Audio("audio/emilia/"+$("voice").value+"/line-"+i+".mp3");audio.playbackRate=Number($("speed").value);if(el)el.classList.add("playing");$("status").textContent="🔊 One sentence only — listen and repeat.";audio.onended=()=>{if(el)el.classList.remove("playing");$("status").textContent="Your turn, Aboud! Say the sentence."};audio.onerror=()=>{$("status").textContent="Recording unavailable. Please try again."};audio.play().catch(()=>{$("status").textContent="Playback could not start."})}function illustration(scene){
const night=scene>=6;const sky=night?'#26365e':'#f9d48d';
const girl='<g transform="translate(230 78)"><path d="M-36 79 Q-61 130 -45 174 L46 174 Q64 128 34 79Z" fill="#6152b2"/><path d="M-30 4 Q-54 -35 -18 -52 Q26 -67 42 -27 L40 48 Q8 73 -24 38Z" fill="#49312b"/><ellipse cx="0" cy="6" rx="39" ry="46" fill="#f7c39c"/><path d="M-37 -6 Q-30 -57 9 -47 Q38 -37 38 -3 Q8 -24 -3 -19 Q-22 -1 -37 -6" fill="#49312b"/><ellipse cx="-12" cy="8" rx="6" ry="9" fill="white"/><ellipse cx="15" cy="8" rx="6" ry="9" fill="white"/><circle cx="-10" cy="10" r="3" fill="#263552"/><circle cx="17" cy="10" r="3" fill="#263552"/><path d="M-6 31 Q5 39 16 29" stroke="#b25362" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M-36 83 Q-77 105 -67 137 M35 83 Q73 105 63 136" stroke="#f7c39c" stroke-width="16" fill="none" stroke-linecap="round"/></g>';
const sofa='<rect x="30" y="184" width="440" height="95" rx="26" fill="#e8b951"/><rect x="50" y="160" width="400" height="75" rx="27" fill="#f5d875"/><path d="M58 230 H440" stroke="#bc9a40" stroke-width="6"/>';
const shed='<path d="M28 120 L128 38 L228 120Z" fill="#956843"/><rect x="48" y="118" width="160" height="155" fill="#d7b77c" stroke="#815b39" stroke-width="5"/><path d="M128 155 H195 V273 H128Z" fill="#473c39"/>';
const party='<path d="M25 35 Q130 90 250 35 Q370 90 480 35" stroke="#e8b747" stroke-width="8" fill="none"/><circle cx="55" cy="45" r="12" fill="#e47b94"/><circle cx="445" cy="45" r="12" fill="#82cbb6"/><rect x="20" y="235" width="470" height="50" rx="16" fill="#d9aa72"/>';
const outside='<circle cx="415" cy="49" r="25" fill="#ffe7ac"/><path d="M0 210 Q110 165 240 210 T500 210 V300 H0" fill="#588a72"/><path d="M40 220 V105 M40 135 L15 112 M40 145 L65 115" stroke="#385c51" stroke-width="25" stroke-linecap="round"/>';
const binoc='<g transform="translate(175 105)"><rect x="0" y="0" width="94" height="40" rx="14" fill="#25394e"/><circle cx="12" cy="20" r="20" fill="#34495e" stroke="#182c3e" stroke-width="7"/><circle cx="85" cy="20" r="20" fill="#34495e" stroke="#182c3e" stroke-width="7"/><rect x="33" y="-7" width="35" height="25" rx="8" fill="#26374b"/></g>';
const dad='<g transform="translate(80 120)"><circle cx="0" cy="0" r="35" fill="#efbd94"/><path d="M-34 -8 Q-29 -50 13 -38 Q40 -28 34 0 L12 -25Z" fill="#43352e"/><path d="M-45 45 L45 45 L65 160 L-65 160Z" fill="#394e83"/><path d="M-12 45 L0 86 L12 45" fill="#e85d67"/><path d="M-10 10 Q0 18 10 10" stroke="#694333" stroke-width="3" fill="none"/></g>';
let bg=night?outside:party;let objects='';
if(scene<=1){bg=party+sofa;objects=girl}
else if(scene<=4){bg=party;objects=girl+dad}
else if(scene===5){bg=sofa;objects=girl+binoc}
else if(scene===6){bg=outside;objects=girl+binoc}
else if(scene===7){bg=outside;objects=girl+binoc+'<path d="M370 100 l12 -35 l12 35 l35 12 l-35 12 l-12 35 l-12 -35 l-35 -12Z" fill="#ffe08a"/>'}
else if(scene===8){bg=outside+shed;objects=girl}
else if(scene===9){bg=party;objects=girl+dad}
else if(scene===10){bg=party;objects=dad+girl}
else if(scene===11){bg=party;objects=dad+girl+'<g fill="#f7c39c"><circle cx="405" cy="125" r="32"/><circle cx="340" cy="130" r="28"/></g>'}
else if(scene===12){bg=party;objects=girl+'<circle cx="100" cy="120" r="52" fill="#fff7d9" stroke="#536078" stroke-width="8"/><path d="M100 120 V80 M100 120 L115 128" stroke="#536078" stroke-width="6"/>'}
else{bg=outside;objects=girl+'<path d="M50 60 L60 30 L70 60 L100 70 L70 80 L60 110 L50 80 L20 70Z" fill="#ffdd7b"/>'}
return '<svg viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustrated scene '+(scene+1)+' from Emilia story"><rect width="500" height="300" fill="'+sky+'"/>'+bg+objects+'</svg>'
}function render(){const start=pg?P[0].length:0;const rows=P[pg];$("cards").innerHTML=rows.map((s,i)=>{const n=start+i,scene=Math.min(13,Math.floor(n/2));return '<article class="story"><div class="scene">'+illustration(scene)+'<small>Scene '+(scene+1)+'</small></div><div class="words"><p>'+s.replaceAll("&","&amp;").replaceAll("<","&lt;")+'</p><div class="controls"><button class="primary" data-read="'+n+'">🔊 Read</button><button data-repeat="'+n+'">🔁 Repeat</button><button data-done="'+n+'">⭐ I read it!</button></div></div></article>'}).join("");document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("selected",Number(b.dataset.page)===pg))}document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.page!==undefined){pg=Number(b.dataset.page);stop();render()}if(b.dataset.read!==undefined||b.dataset.repeat!==undefined){play(Number(b.dataset.read??b.dataset.repeat),b.closest(".story"))}if(b.dataset.done!==undefined){b.textContent="✅ Great job!";b.disabled=true}});$("voice").onchange=stop;$("speed").onchange=()=>{if(audio)audio.playbackRate=Number($("speed").value)};$("try").onclick=()=>play(0);$("stop").onclick=stop;function quiz(){const x=Q[q];$("question").textContent=(q+1)+". "+x[0];$("options").innerHTML=x[1].map((t,i)=>'<button data-answer="'+i+'">'+t+'</button>').join("");$("feedback").textContent=""}$("options").onclick=e=>{const b=e.target.closest("[data-answer]");if(!b||$("feedback").textContent)return;const x=Q[q],ok=Number(b.dataset.answer)===x[2];b.classList.add(ok?"correct":"wrong");$("feedback").textContent=ok?"Correct! ⭐":"Try again: "+x[1][x[2]]};$("next").onclick=()=>{q=(q+1)%Q.length;quiz()};render();quiz();</script></body></html>
