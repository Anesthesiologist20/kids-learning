ion').textContent=q[0];el('answers').innerHTML=q.slice(1,4).map((a,j)=>'<button class="answer '+(answers[i]===j?(j===q[4]?'chosen':'wrong'):'')+'" '+(answers[i]!==null?'disabled':'')+' onclick="pick('+j+')">'+['أ','ب','ج'][j]+' — '+a+'</button>').join('');el('feedback').textContent=answers[i]===null?'اختاري الإجابة الصحيحة. لا يمكن تغيير الاختيار.':answers[i]===q[4]?'⭐ إجابة صحيحة!':'تم تسجيل الإجابة. ستظهر الإجابة الصحيحة في المراجعة النهائية.'}function pick(j){if(answers[i]!==null)return;answers[i]=j;save();render()}function jump(j){i=j;render()}function move(d){i=Math.max(0,Math.min(19,i+d));render()}function finish(){let missing=answers.filter(x=>x===null).length;if(missing&&!confirm('بقي '+missing+' سؤال دون إجابة. هل تريدين إنهاء الاختبار؟'))return;let score=answers.filter((x,j)=>x===sets[s][j][4]).length;el('quiz').classList.add('hidden');el('result').classList.remove('hidden');el('result').innerHTML='<h2>🏅 نتيجة '+names[s]+'</h2><h1>'+score+' / 20</h1><p>'+(score>=18?'ممتازة يا سكينة! 🌟':score>=14?'أحسنتِ! راجعي أخطاءك 💪':'راجعي الإجابات وحاولي مرة أخرى 🌷')+'</p><button class="primary" onclick="restart()">إعادة النموذج من البداية</button><button onclick="goHome()">اختيار نموذج آخر</button><h3>📚 مراجعة الإجابات</h3>'+sets[s].map((q,j)=>'<div style="padding:12px;border-bottom:1px solid #ddd"><b>'+(j+1)+'. '+q[0]+'</b><p>إجابتك: '+(answers[j]===null?'لم تجيبي':q[answers[j]+1])+' '+(answers[j]===q[4]?'✅':'❌')+'</p><p style="color:#137a4a">الصحيح: '+q[q[4]+1]+'</p></div>').join('')}function restart(){if(!confirm('إعادة النموذج ومسح إجاباته السابقة؟'))return;try{localStorage.removeItem('sakinahScience'+s)}catch(e){}start(s)}function goHome(){el('quiz').classList.add('hidden');el('result').classList.add('hidden');el('home').parentElement.classList.remove('hidden');home()}home();</script></html>
