name: Sync Raghd Layla audio

on:
  workflow_dispatch:
    inputs:
      layla_voice_id:
        description: "Layla voice ID from ElevenLabs"
        required: true
        type: string
      source:
        description: "Where the clips were generated"
        required: true
        default: TTS
        type: choice
        options:
          - TTS
          - Flows

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download matching Layla clips
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          LAYLA_VOICE_ID: ${{ inputs.layla_voice_id }}
          ELEVENLABS_SOURCE: ${{ inputs.source }}
        run: python3 scripts/sync_raghd_layla_audio.py
      - name: Commit changed audio and refresh cache version
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- raghd/audio; then
            echo "No audio changes; nothing to commit."
            exit 0
          fi
          sed -i -E "s/kids-learning-pwa-v([0-9]+)/kids-learning-pwa-v$(( $(grep -oE 'kids-learning-pwa-v[0-9]+' sw.js | head -n1 | grep -oE '[0-9]+') + 1 ))/" sw.js
          git add raghd/audio sw.js
          git commit -m "Update Raghd Layla audio and offline cache"
          git push
