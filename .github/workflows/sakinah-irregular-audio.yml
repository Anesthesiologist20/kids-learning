name: Sakinah Irregular Verb AI Audio
on:
  push:
    paths:
      - '.github/workflows/sakinah-irregular-audio.yml'
      - 'sakinah/irregular-audio-manifest.json'
      - 'scripts/generate_irregular_audio.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sakinah-irregular-ai-audio
  cancel-in-progress: false
jobs:
  generate:
    name: Generate ${{ matrix.voice }} voice clips
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        voice: [bella, heart, sarah]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kokoro dependencies and MP3 encoder
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg
          python -m pip install --upgrade pip
          python -m pip install 'kokoro>=0.9.2,<1.0' numpy soundfile
      - name: Render short MP3s and verify files
        run: python scripts/generate_irregular_audio.py ${{ matrix.voice }}
      - name: Publish AI audio to the repository
        env:
          VOICE: ${{ matrix.voice }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "sakinah/audio/irregular/$VOICE/"
          if git diff --cached --quiet; then
            echo "This teacher's recordings are already saved."
            exit 0
          fi
          git commit -m "Audio: short irregular verb AI clips ($VOICE)"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git rebase origin/main || {
              git rebase --abort || true
              echo "Cannot safely rebase audio changes."
              exit 1
            }
            if git push origin HEAD:main; then
              echo "Voice files were successfully published."
              exit 0
            fi
            sleep 4
          done
          echo "Publish failed after 8 retries."
          exit 1
