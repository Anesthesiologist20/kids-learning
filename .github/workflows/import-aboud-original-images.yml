name: Import Eight Independent Aboud Images
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-aboud-original-images.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: import-aboud-original-images
  cancel-in-progress: false
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install 'Pillow>=10,<12'
      - name: Download 8 generated original scenes and optimize them
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from io import BytesIO
          import urllib.request, json, time
          urls=json.loads("[\"https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3.1-flash-image/images/1e3533ef-5461-496e-ac9e-d94bfcfc56b6/f71ab282-80af-4baf-8d1e-3e42e34091e9/ONE_SINGLE_standalone_full_bleed_landscape_16_9_cinematic_3D.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYzhiMDMxZTk1NmI3ZmMxZSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MzEyNzkxM30.Q9aJeB3R9XGgo9EMi5vs7kPxeuj7bw2WrLtcBvRbyds\",\"https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3.1-flash-image/images/870c4234-d4b5-4685-afa3-bfaca7d79a3c/7151a9b8-2408-449c-b215-cd03b8360e3f/_aboud_is_the_SAME_central_main_character_from_this_referenc.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYjdjYWMyMjBiOGQ4M2QxNiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MzA0ODA5Nn0.tDv28oP1MvL8dnrJGsIc8Q3li_Ur0D3oevb5YZeC7as\",\"https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3.1-flash-image/images/12df1332-9f14-4ff5-b6ea-3798edaafc42/d131149a-bebd-4799-b638-f469af833403/_aboud_is_the_SAME_central_main_character_from_this_referenc.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiODEwZTkxYjRiYjc0M2VjZiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MzA5MDg2OH0.6cGVgulDAa9A4LM467Jl36jrqaM_DAGd_viQ1ffKA5g\",\"https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3.1-flash-image/images/1d2a73fb-697f-4fd0-8651-084ae23fa469/e3ee5a17-235f-4ad0-8f48-85825b4d2429/_aboud_is_the_SAME_central_main_character_from_this_referenc.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNWJlOWQ3YWU5MTZiODNhMiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MzEzMDE1OH0.NqyTBmyiid1wnXUNuPlHgoWJA0CpNwjwDGwJULj7oxA\",\"https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3.1-flash-image/images/44d75ee0-eb45-4888-932d-78ce9a4e4055/5c9de0e0-22ff-4155-80c9-eaad48766c8e/_aboud_is_the_SAME_central_main_character_from_this_referenc.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZDg1NzY4MTMyMTU2ZDMzNSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MzA4ODUzMX0.S-J8IDIUObJii2MN069l_JUaza5q2r0E74PgI_J20Co\",\"https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3.1-flash-image/images/8e66d07c-44c5-4b8d-92f2-7f73e80067ff/d5ed87c6-edc5-4687-b460-7adaefb7a759/_aboud_is_the_SAME_central_main_character_from_this_referenc.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNmQ5ZWYyN2Y2NWUwOWFlZCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MzA4MjExMX0.dFs2Aguag9wUQ6DgRYWMfsj9xsBHL58vlTUAvAY2g6Y\",\"https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3.1-flash-image/images/47609bed-ad70-4992-88ef-be18be35075b/0a3415e3-0c1b-4c77-a057-2377f38fc28b/_aboud_is_the_SAME_central_main_character_from_this_referenc.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMDkzM2MwMTg0MTg4Nzg3MCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MzA0ODg1Nn0.39lzAjM7-eKNi2QYkcGDWmoC5WKICNX3QHZZIGGXV-A\",\"https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3.1-flash-image/images/71be0aad-e3d6-462f-8ee0-144086eb8047/6ada750e-cfd0-4b36-99fd-03954af1452b/_aboud_is_the_SAME_central_main_character_from_this_referenc.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNTU0MmVhY2Q0MzM3ZjBiMyIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MzA2OTY0NX0.tMr7HSJNpHMWsKmA-szcfaGEIqb2HQGt8ZI2VDFgVPY\"]")
          out=Path('experimental/aboud-hobbies-adventure/images')
          out.mkdir(parents=True,exist_ok=True)
          for i,url in enumerate(urls,1):
              request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(request,timeout=60) as reply:
                          buf=reply.read()
                      assert len(buf)>20000
                      im=Image.open(BytesIO(buf)).convert('RGB')
                      assert im.width/im.height>1.6 and im.width/im.height<1.95, im.size
                      im.save(out/f'{i:02d}.webp','WEBP',quality=85,method=6)
                      print(i,im.size,(out/f'{i:02d}.webp').stat().st_size,flush=True)
                      break
                  except Exception as ex:
                      if attempt==2: raise
                      time.sleep(5)
          assert len(list(out.glob('[0-9][0-9].webp')))==8
          
          PY
      - name: Publish images without modifying other stories
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experimental/aboud-hobbies-adventure/images/*.webp
          if git diff --cached --quiet; then echo 'Images already published'; exit 0; fi
          git commit -m 'images(aboud): eight original standalone 16x9 hobby scenes'
          for n in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            if git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          exit 1
