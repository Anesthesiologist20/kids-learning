name: Healthy Eating Heart Extra Slow
on:
  push:
    branches: [main]
    paths: ['.github/workflows/healthy-eating-audio.yml', 'aboud/healthy-eating/audio-text.json', 'scripts/generate_healthy_audio.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y espeak-ng ffmpeg
      - run: pip install 'kokoro>=0.9.4,<1.0' numpy soundfile
      - run: python scripts/generate_healthy_audio.py
      - name: Publish recordings
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aboud/healthy-eating/audio
          git diff --cached --quiet && exit 0
          git commit -m 'Add Healthy Eating Heart Extra Slow audio'
          git pull --rebase origin main
          git push origin HEAD:main
