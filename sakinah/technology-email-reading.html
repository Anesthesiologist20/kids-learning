<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sakinah • Technology Email Reading</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f3ff;color:#292446;font-family:system-ui,-apple-system,sans-serif}header{background:#6148b1;color:white;padding:16px 4%;display:flex;justify-content:space-between;gap:12px;align-items:center}header a{color:white}main{max-width:1150px;margin:auto;padding:22px 16px 70px}h1{font-size:clamp(28px,4vw,46px);margin:10px 0}p{line-height:1.5}.controls{display:flex;gap:12px;flex-wrap:wrap;background:white;border-radius:20px;padding:16px;margin:18px 0;align-items:end}label{font-weight:700;display:grid;gap:6px}select,button{font:inherit;min-height:48px;border-radius:12px;padding:9px 14px}select{border:2px solid #d5c9f3;background:white}button{border:0;background:#6c4db7;color:white;font-weight:800;cursor:pointer}button.secondary{background:#ece5ff;color:#513698}.tabs{display:flex;gap:10px;flex-wrap:wrap}.tabs button.active{background:#263c80}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:18px;margin-top:18px}.card{background:white;border:2px solid #e3daf8;border-radius:22px;padding:16px;box-shadow:0 5px 16px #35236710}.scene{width:100%;height:185px;border-radius:16px;background:linear-gradient(135deg,#eee7ff,#dcf4ff);display:grid;place-items:center;font-size:76px;cursor:zoom-in}.sentence{font-size:clamp(21px,2.2vw,28px);font-weight:750;min-height:90px;line-height:1.45;margin:16px 0}.buttons{display:flex;flex-wrap:wrap;gap:8px}.buttons button{flex:1}.status{font-size:13px;color:#735d89;min-height:22px;margin-top:10px}.modal{position:fixed;inset:0;background:#17132be9;display:none;z-index:10;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.zoom{background:white;border-radius:25px;width:min(95vw,900px);padding:25px;text-align:center}.zoom .art{background:#eee8ff;border-radius:20px}.zoom .art img,.zoom .art svg{width:100%;max-height:65vh;object-fit:contain}.scene img{width:100%;height:100%;object-fit:contain}.scene svg{width:100%;height:100%;object-fit:contain}.zoom p{font-size:clamp(26px,5vw,48px);font-weight:800}.hint{font-size:14px;color:#66577f} @media(min-width:700px){.grid{grid-template-columns:repeat(2,1fr)}} .card{overflow:hidden;transition:transform .18s}.card:focus-within{border-color:#9870ed}.scene{height:auto;aspect-ratio:16/10;overflow:hidden;position:relative}.scene svg{transition:transform .2s}.scene:hover img{transform:scale(1.03)}.card .sentence{min-height:0}.buttons button{min-width:100px}.card .number{display:inline-block;background:#f1eaff;color:#5a3d9c;border-radius:20px;padding:4px 12px;font-size:13px;font-weight:800;margin-top:10px}.card.done{border-color:#75c99b;background:#fbfffc}.modal{overflow:auto}.zoom{max-height:95vh;overflow:auto}@media(max-width:700px){.grid{grid-template-columns:1fr}.scene{aspect-ratio:16/9}.controls{gap:8px}.controls label{flex:1}.zoom{padding:12px}.buttons button{min-width:0}}@media(prefers-reduced-motion:reduce){.scene svg{transition:none}}.reader-nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0}.reader-nav button{flex:1;min-width:100px}.reader-nav button:disabled{opacity:.4;cursor:not-allowed}#zoomtext{text-align:center;font-size:clamp(23px,3vw,34px);font-weight:850;line-height:1.4}#zoomcount{text-align:center}.zoom .art img{max-height:55vh;object-fit:contain}.zoom{width:min(95vw,900px)}@media(max-width:600px){.reader-nav{gap:6px}.reader-nav button{padding:10px 5px;font-size:14px}}</style></head><body>
<header><b>🌷 Sakinah's Reading Adventure</b><a href="index.html">← Sakinah Home</a></header><main><h1>💌 Technology Email Reading</h1><p>Look at the picture. Listen. Read aloud. Zoom in to see more!</p><div class="tabs" id="tabs"></div><div class="controls"><label>Teacher voice<select id="voice"><option value="bella">🌸 Bella</option><option value="heart">💜 Heart</option><option value="sarah">⭐ Sarah</option></select></label><label>Reading speed<select id="speed"><option value=".7">🐢 Extra slow</option><option value=".85" selected>🌿 Slow</option><option value="1">🙂 Normal</option></select></label><button class="secondary" id="stop">⏹ Stop</button><button class="secondary" id="larger">A+ Bigger text</button></div><p class="hint">Audio uses recorded Kokoro AI voices, never browser speech. New recordings must be uploaded before playback becomes available.</p><div id="journey" style="background:white;border-radius:18px;padding:15px;margin-top:16px;font-weight:800" role="status">⭐ 0 sentences practiced</div><section class="grid" id="cards"></section></main><div class="modal" id="modal" role="dialog" aria-modal="true"><div class="zoom"><button id="close">✕ Close</button><div class="art" id="zoomart"></div><p id="zoomtext"></p><div class="reader-nav"><button id="prevScene">⬅ Previous</button><button id="readScene">🔊 Read</button><button id="nextScene">Next ➡</button></div><div id="zoomstatus" class="status" role="status"></div><div id="zoomcount" class="status"></div></div></div><script>
const sceneImages=[["museum_hero.webp","museum_hero.webp","museum_visit.webp","big_robot.webp","smart_robot.webp","robot_dancing.webp","small_robot.webp","fun_day.webp","robot_question.webp","museum_hero.webp"],["watch_hero.webp","watch_hero.webp","store_visit.webp","pink_watch.webp","small_pink_watch.webp","watch_steps.webp","liked_watch.webp","watch_question.webp","watch_hero.webp"]];function illustration(story,i){const src=sceneImages[story][i];return '<img src="'+src+'" alt="Illustrated scene for sentence '+(i+1)+'" loading="lazy" decoding="async" style="display:block;width:100%;height:100%;object-fit:contain;background:#fff4fa" onerror="this.alt=\'Illustration unavailable\'">'}
const stories=[{"title":"The Robot Museum","emoji":"🤖","lines":[["Hi Sara,","👋"],["How are you?","💌"],["I went to a technology museum yesterday.","🏛️"],["I saw a big robot next to the door.","🤖🚪"],["It was amazing and very smart.","✨🧠"],["The robot could talk and dance.","🕺🤖"],["I played with a small robot on the table.","🤖🪑"],["It was a fun day!","🎉"],["Do you like robots?","❓🤖"],["Your friend, Sakinah","💜"]]},{"title":"My New Smart Watch","emoji":"⌚","lines":[["Hi Sara,","👋"],["How are you?","💌"],["Yesterday, I went to Jarir store.","🏬"],["I saw a beautiful smart watch on the table.","⌚"],["It was small and pink.","🩷⌚"],["It can tell the time and count my steps.","🕒👟"],["I really liked it!","😍"],["Do you have a smart watch?","❓⌚"],["Your friend, Sakinah","💜"]]}];let current=0,player=null,fontBoost=0,zoomIndex=0;const savedKey="sakinah-tech-email-read-v1";let read=new Set(JSON.parse(localStorage.getItem(savedKey)||"[]"));function progress(){el("journey").textContent="⭐ "+read.size+" / 19 sentences practiced · Your progress is saved."}
const el=id=>document.getElementById(id);const tabs=el('tabs'),cards=el('cards');
function stop(){if(player){player.pause();player.removeAttribute('src');player=null}}
function play(i,status){stop();const voice=el('voice').value;const src='audio/kokoro/'+voice+'/technology-email-'+(current+1)+'-'+String(i+1).padStart(2,'0')+'.mp3';const a=new Audio(src);player=a;a.playbackRate=Number(el('speed').value);status.textContent='Loading recorded voice…';a.onplaying=()=>status.textContent='🔊 Listen and repeat!';a.onended=()=>status.textContent='⭐ Your turn to read!';a.onerror=()=>status.textContent='Recording not uploaded yet — audio unavailable.';a.play().catch(()=>status.textContent='Recording unavailable or playback blocked.');}
function openReader(i){zoomIndex=i;renderReader();el('modal').classList.add('open');el('close').focus()}function renderReader(){stop();el('zoomart').innerHTML=(current===1&&(zoomIndex===5||zoomIndex===6))?'':illustration(current,zoomIndex);el('zoomtext').textContent=stories[current].lines[zoomIndex][0];el('zoomcount').textContent=(zoomIndex+1)+' / '+stories[current].lines.length;el('zoomstatus').textContent='';el('prevScene').disabled=zoomIndex===0;el('nextScene').disabled=zoomIndex===stories[current].lines.length-1}function moveReader(delta){const next=zoomIndex+delta;if(next>=0&&next<stories[current].lines.length){zoomIndex=next;renderReader()}}function draw(){stop();tabs.innerHTML='';stories.forEach((s,n)=>{let b=document.createElement('button');b.textContent=s.emoji+' '+s.title;b.className=n===current?'active':'';b.onclick=()=>{current=n;draw()};tabs.appendChild(b)});cards.innerHTML='';stories[current].lines.forEach(([line,emoji],i)=>{let card=document.createElement('article');card.className='card'+(read.has(current+'-'+i)?' done':'');let number=document.createElement('span');number.className='number';number.textContent='Sentence '+(i+1)+' of '+stories[current].lines.length;let scene=document.createElement('div');scene.className='scene';scene.innerHTML=illustration(current,i);if(current===1&&(i===5||i===6)){scene.style.display='none';}scene.setAttribute('role','img');scene.setAttribute('aria-label','Illustration for sentence '+(i+1));let sentence=document.createElement('div');sentence.className='sentence';sentence.textContent=line;sentence.style.fontSize='calc(clamp(21px,2.2vw,28px) + '+fontBoost+'px)';let controls=document.createElement('div');controls.className='buttons';let listen=document.createElement('button');listen.textContent='🔊 Listen';let zoom=document.createElement('button');zoom.className='secondary';zoom.textContent='🔎 Zoom';let status=document.createElement('div');status.className='status';listen.onclick=()=>play(i,status);zoom.onclick=scene.onclick=()=>openReader(i);if(current===1&&(i===5||i===6)){zoom.style.display='none';}let done=document.createElement('button');done.className='secondary';done.textContent=read.has(current+'-'+i)?'⭐ Practiced':'☆ I read it!';done.onclick=()=>{read.add(current+'-'+i);localStorage.setItem(savedKey,JSON.stringify([...read]));done.textContent='⭐ Practiced';card.classList.add('done');progress()};controls.append(listen,zoom,done);card.append(number,scene,sentence,controls,status);cards.appendChild(card)});progress()}
el('prevScene').onclick=()=>moveReader(-1);el('nextScene').onclick=()=>moveReader(1);el('readScene').onclick=()=>play(zoomIndex,el('zoomstatus'));el('stop').onclick=stop;el('larger').onclick=()=>{fontBoost=(fontBoost+6)%24;draw()};el('close').onclick=()=>{stop();el('modal').classList.remove('open')};el('modal').onclick=e=>{if(e.target===el('modal')){stop();el('modal').classList.remove('open')}};document.addEventListener('keydown',e=>{if(e.key==='Escape'){stop();el('modal').classList.remove('open')}if(el('modal').classList.contains('open')&&e.key==='ArrowRight')moveReader(1);if(el('modal').classList.contains('open')&&e.key==='ArrowLeft')moveReader(-1)});window.addEventListener('pagehide',stop);draw();
</script></body></html>
