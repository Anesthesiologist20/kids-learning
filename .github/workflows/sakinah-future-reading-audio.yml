name: Sakinah Future Technology Reading - 81 Free Kokoro Clips
on:
  push:
    paths:
      - '.github/workflows/sakinah-future-reading-audio.yml'
      - 'scripts/generate_sakinah_future_reading_audio.py'
      - 'sakinah/technology-future-reading.html'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sakinah-future-reading-kokoro
  cancel-in-progress: false
jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        voice: [heart, bella, sarah]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free Kokoro tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          python -m pip install 'kokoro>=0.9.4,<1.0' soundfile numpy
      - name: Generate and verify all 27 sentences
        run: python scripts/generate_sakinah_future_reading_audio.py ${{ matrix.voice }}
      - name: Publish MP3 to GitHub Pages
        env:
          VOICE: ${{ matrix.voice }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "sakinah/audio/kokoro/$VOICE/future-"*.mp3
          if git diff --cached --quiet; then
            echo "Already published"
            exit 0
          fi
          git commit -m "audio(sakinah): future reader free Kokoro $VOICE recordings"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            if git push origin HEAD:main; then
              echo "Published all $VOICE recordings"
              exit 0
            fi
            sleep 4
          done
          echo "Could not publish recordings" >&2
          exit 1
