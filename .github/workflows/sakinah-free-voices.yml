name: Sakinah Free AI Voices
on:
  push:
    paths:
      - '.github/workflows/sakinah-free-voices.yml'
      - 'sakinah/voice-manifest.json'
      - 'scripts/generate_kokoro_sakinah.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sakinah-free-ai-voices
  cancel-in-progress: false
jobs:
  generate:
    name: Generate reusable AI speech (no paid API)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout GitHub Pages repository
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install text to speech dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg
          python -m pip install --upgrade pip
          python -m pip install "kokoro>=0.9.2,<1.0" soundfile numpy
      - name: Generate free Kokoro AI MP3 lessons
        run: python scripts/generate_kokoro_sakinah.py sakinah/voice-manifest.json
      - name: Verify fifteen MP3 recordings
        run: |
          python - <<'PY'
          from pathlib import Path
          files = sorted(Path("sakinah/audio/kokoro").glob("*/*.mp3"))
          assert len(files) == 15, f"Expected 15 audio files; got {len(files)}"
          for p in files:
              assert p.stat().st_size > 1000, f"Invalid audio file: {p}"
          print("Verified:", len(files), "MP3 files")
          PY
      - name: Publish recordings safely with rebase and retry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sakinah/audio/kokoro/
          if git diff --cached --quiet; then
            echo "All AI audio files were already up to date."
            exit 0
          fi
          git commit -m "Audio: Sakinah adjective AI voice lessons (Kokoro)"
          for attempt in 1 2 3 4 5; do
            echo "Publish attempt $attempt / 5"
            git fetch origin main
            git rebase origin/main || {
              echo "Rebase conflict: refusing to overwrite any existing changes"
              git rebase --abort || true
              exit 1
            }
            if git push origin HEAD:main; then
              echo "Audio published successfully"
              exit 0
            fi
            sleep 3
          done
          echo "Publishing failed after 5 non-destructive retries"
          exit 1
