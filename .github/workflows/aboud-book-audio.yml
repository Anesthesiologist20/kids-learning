name: Generate Aboud Book Bella and Heart Audio

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aboud-book-audio.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aboud-book-kokoro-audio
  cancel-in-progress: false

jobs:
  render:
    name: Render 106 MP3 clips with Kokoro
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system speech dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y espeak-ng ffmpeg

      - name: Install CPU-only Kokoro
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.5.1" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "kokoro==0.9.4" numpy soundfile

      - name: Generate Bella and Heart clips
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python scripts/generate_aboud_book_audio.py

      - name: Verify all recordings
        run: |
          test "$(find experimental/book-of-adventures/audio/af_bella -name '*.mp3' -size +1k | wc -l)" -eq 53
          test "$(find experimental/book-of-adventures/audio/af_heart -name '*.mp3' -size +1k | wc -l)" -eq 53

      - name: Commit speech recordings to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experimental/book-of-adventures/audio/
          if ! git diff --cached --quiet; then
            git commit -m "Add 106 Kokoro Bella and Heart recordings for Aboud Book"
            git push
          fi
