<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aboud · Emilia Illustrated Reading</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f6ff;color:#24334f;font:clamp(16px,2vw,21px)/1.55 system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:14px}a{color:#355a9a}header{background:linear-gradient(120deg,#55429c,#244c92);color:white;border-radius:20px;padding:20px}h1{font-size:clamp(27px,4vw,44px);margin:6px 0}.toolbar{display:flex;flex-wrap:wrap;align-items:end;gap:12px;background:#fff;padding:15px;border-radius:16px;margin:14px 0}label{display:grid;gap:4px;font-weight:750}button,select{font:inherit;border:1px solid #d1d9eb;border-radius:12px;padding:9px 12px;min-height:45px;cursor:pointer}button{background:#e9ecff;color:#354d89;font-weight:800}.primary{background:#f23c76;color:white;border:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.story{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 5px 18px #283b6c16}.scene{height:180px;display:grid;place-items:center;position:relative;background:linear-gradient(140deg,#fee5a9,#b6d9fa);font-size:4.5rem}.scene small{position:absolute;bottom:10px;left:12px;font-size:.75rem;color:#223c69;background:#ffffffda;padding:3px 9px;border-radius:20px}.words{padding:14px}.words p{margin:0 0 12px;font-weight:650}.controls{display:flex;flex-wrap:wrap;gap:8px}.playing{outline:4px solid #ffca75}.pages{display:flex;justify-content:space-between;gap:8px;margin:15px 0}.pages button.selected{background:#3757ae;color:white}.status{font-size:.82rem;color:#68528e;flex-basis:100%}.quiz{background:white;padding:18px;border-radius:16px;margin:18px 0}.quiz button{margin:4px}.correct{background:#daf3e5}.wrong{background:#ffdde4}@media(max-width:650px){.grid{grid-template-columns:1fr}.scene{height:160px}.toolbar label{flex:1}}</style></head><body><main><a href="./">← Aboud's corner</a><header><h1>📚 Emilia's New Year's Adventure</h1><p>Illustrated story · Pages 40–41 · One sentence, one listen button · Read with Aboud!</p></header><div class="toolbar"><label>🎙️ Teacher<select id="voice"><option value="bella">Bella 🌸</option><option value="heart">Heart 💜</option><option value="sarah">Sarah ⭐</option></select></label><label>🐢 Speed<select id="speed"><option value="0.7">Very slow</option><option value="0.85" selected>Slow</option><option value="1">Normal</option></select></label><button id="try">▶ Test voice</button><button id="stop">⏹ Stop</button><div class="status" id="status" role="status">Tap Read to hear one sentence, then repeat it aloud.</div></div><div class="pages"><button data-page="0" class="selected">📖 Page 40</button><button data-page="1">📖 Page 41</button></div><div class="grid" id="cards"></div><div class="quiz"><h2>🕵️ Detective Quiz</h2><p id="question"></p><div id="options"></div><p id="feedback"></p><button id="next">Next question →</button></div></main><script>const P=[["Emilia is sitting on the sofa.","She’s looking out the window.","I’m so bored!","It’s her parents’ New Year’s Eve party.","How’s second grade?","Any mysteries?","Emilia loves detective games.","She likes reading detective stories, too.","She wants to be a famous detective!","Why don’t you try out your new binoculars?","What a great idea!","I have them in my room.","Emilia gets her binoculars and goes outside.","She’s very excited."],["Emilia is outside looking through the binoculars.","Suddenly, she hears a noise!","She’s scared.","Then, the garden shed door opens.","Who’s there?","Emilia runs into the house.","Dad!","There’s someone in the yard!","Not now, Emilia.","It’s almost midnight.","Emilia looks around.","Everyone is standing in a circle holding hands.","It’s almost midnight.","The new year is coming!","Ten, nine, eight, seven ...","Oh, no!","I have to do something!"]];const S=["Emilia sitting on a yellow sofa at a New Year's Eve party","Emilia looking bored at a festive party with adults chatting","Guests talking to Emilia at the party","A guest asking Emilia about mysteries","Emilia imagining being a detective, magnifying glass and mystery books","Emilia getting binoculars from her room","Emilia walking into the moonlit garden with binoculars","Emilia hears a noise and looks startled outside","A wooden garden shed door opening in the night","Emilia rushing inside to find Dad","Dad waiting for the midnight countdown with the guests","Guests holding hands in a circle near midnight","A happy new year banner and countdown clock","Emilia remembering she must investigate the mystery"];const E=["🛋️","😑","🎉","❓","🔎","🔭","🌙","😱","🏚️","🏃‍♀️","👨","🧑‍🤝‍🧑","🕛","🎆"];const $=id=>document.getElementById(id);let pg=0,audio=null,q=0;const Q=[["Why is Emilia bored?",["She is at a party.","She is at school."],0],["What does Emilia want to become?",["A detective","A singer"],0],["What does Mom give Emilia?",["Binoculars","A football"],0],["What opens in the garden?",["A shed door","A car door"],0],["Why is Dad busy?",["It is almost midnight.","He is asleep."],0]];function stop(){if(audio){audio.pause();audio.src="";audio=null}document.querySelectorAll(".playing").forEach(e=>e.classList.remove("playing"))}function play(i,el){stop();audio=new Audio("audio/emilia/"+$("voice").value+"/line-"+i+".mp3");audio.playbackRate=Number($("speed").value);if(el)el.classList.add("playing");$("status").textContent="🔊 One sentence only — listen and repeat.";audio.onended=()=>{if(el)el.classList.remove("playing");$("status").textContent="Your turn, Aboud! Say the sentence."};audio.onerror=()=>{$("status").textContent="Recording unavailable. Please try again."};audio.play().catch(()=>{$("status").textContent="Playback could not start."})}function render(){const start=pg?P[0].length:0;const rows=P[pg];$("cards").innerHTML=rows.map((s,i)=>{const n=start+i,scene=Math.min(13,Math.floor(n/2));return '<article class="story"><div class="scene"><span>'+E[scene]+'</span><small>Scene '+(scene+1)+'</small></div><div class="words"><p>'+s.replaceAll("&","&amp;").replaceAll("<","&lt;")+'</p><div class="controls"><button class="primary" data-read="'+n+'">🔊 Read</button><button data-repeat="'+n+'">🔁 Repeat</button><button data-done="'+n+'">⭐ I read it!</button></div></div></article>'}).join("");document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("selected",Number(b.dataset.page)===pg))}document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.page!==undefined){pg=Number(b.dataset.page);stop();render()}if(b.dataset.read!==undefined||b.dataset.repeat!==undefined){play(Number(b.dataset.read??b.dataset.repeat),b.closest(".story"))}if(b.dataset.done!==undefined){b.textContent="✅ Great job!";b.disabled=true}});$("voice").onchange=stop;$("speed").onchange=()=>{if(audio)audio.playbackRate=Number($("speed").value)};$("try").onclick=()=>play(0);$("stop").onclick=stop;function quiz(){const x=Q[q];$("question").textContent=(q+1)+". "+x[0];$("options").innerHTML=x[1].map((t,i)=>'<button data-answer="'+i+'">'+t+'</button>').join("");$("feedback").textContent=""}$("options").onclick=e=>{const b=e.target.closest("[data-answer]");if(!b||$("feedback").textContent)return;const x=Q[q],ok=Number(b.dataset.answer)===x[2];b.classList.add(ok?"correct":"wrong");$("feedback").textContent=ok?"Correct! ⭐":"Try again: "+x[1][x[2]]};$("next").onclick=()=>{q=(q+1)%Q.length;quiz()};render();quiz();</script></body></html>
